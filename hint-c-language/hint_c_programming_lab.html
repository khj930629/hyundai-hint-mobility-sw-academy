                          );
                        })}
                      </div>

                      <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                        <button
                          onClick={handleSubmitQuiz}
                          disabled={!quizSelected}
                          className="px-4 py-2 rounded-xl bg-mobility-600 disabled:opacity-40 text-white text-xs sm:text-sm font-bold"
                        >
                          정답 제출
                        </button>
                        <button
                          onClick={() => {
                            setQuizIndex((i) => (i + 1) % activeQuizList.length);
                            setQuizSelected('');
                            setQuizFeedback(null);
                          }}
                          className="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 text-xs sm:text-sm font-bold hover:bg-slate-50"
                        >
                          다음 문항 →
                        </button>
                      </div>

                      {quizFeedback && (
                        <div className={`p-3.5 rounded-xl text-xs sm:text-sm ${
                          quizFeedback.isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'
                        }`}>
                          <div className="font-extrabold">
                            {quizFeedback.isCorrect ? '정답입니다!' : `오답입니다. 정답: ${quizFeedback.answer}`}
                          </div>
                          <p className="mt-1">{quizFeedback.explanation}</p>
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            )}

            {/* 6. PROGRESS MENU */}
            {activeMenu === 'progress' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div className="text-xs text-slate-500">전체 이론 진도율</div>
                    <div className="text-2xl font-extrabold text-navy-800 mt-1">{overallPercent}%</div>
                    <div className="text-xs text-slate-500 mt-0.5">{progress.completedLessons.length} / {LESSONS.length} 단원 완료</div>
                  </div>
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div className="text-xs text-slate-500">해결한 실습 문제</div>
                    <div className="text-2xl font-extrabold text-mobility-600 mt-1">{practiceState.solvedIds.length}개</div>
                    <div className="text-xs text-slate-500 mt-0.5">전체 {PRACTICE_PROBLEMS.length}문제 중</div>
                  </div>
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div className="text-xs text-slate-500">퀴즈 정답률</div>
                    <div className="text-2xl font-extrabold text-emerald-700 mt-1">{quizAccuracy}%</div>
                    <div className="text-xs text-slate-500 mt-0.5">풀이 {quizState.history.length}회</div>
                  </div>
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div className="text-xs text-slate-500">저장된 코드 스니펫</div>
                    <div className="text-2xl font-extrabold text-navy-800 mt-1">{snippets.length}개</div>
                    <div className="text-xs text-slate-500 mt-0.5">localStorage 자동 저장</div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2.5">
                    <h2 className="text-sm font-extrabold text-navy-800">단원별 학습 완료 현황</h2>
                    {LESSONS.map((les) => {
                      const done = progress.completedLessons.includes(les.id);
                      return (
                        <div key={les.id} className="flex items-center justify-between py-2 border-b border-slate-100 last:border-none text-xs sm:text-sm">
                          <div>
                            <span className="font-bold text-slate-800">{les.unit}</span>
                            <span className="ml-2 font-mono text-xs text-slate-500">{les.pageRef}</span>
                          </div>
                          <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${
                            done ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'
                          }`}>
                            {done ? '완료' : '진행 전'}
                          </span>
                        </div>
                      );
                    })}
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-extrabold text-navy-800">최근 학습 활동 로그</h2>
                      <div className="flex gap-2">
                        <button
                          onClick={handleExportJson}
                          className="px-2.5 py-1 rounded-lg bg-mobility-100 text-mobility-600 text-xs font-bold"
                        >
                          JSON 내보내기
                        </button>
                        <button
                          onClick={handleResetAllData}
                          className="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 text-xs font-bold"
                        >
                          기록 초기화
                        </button>
                      </div>
                    </div>
                    <div className="space-y-2 max-h-[340px] overflow-y-auto">
                      {(progress.activityLog || []).length === 0 ? (
                        <div className="text-xs text-slate-500 py-6 text-center">아직 기록된 활동이 없습니다.</div>
                      ) : (
                        progress.activityLog.map((act) => (
                          <div key={act.id} className="p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs flex items-center justify-between gap-2">
                            <div>
                              <span className="font-semibold text-slate-800">{act.text}</span>
                              {act.pageRef && <span className="ml-2 font-mono text-slate-500">({act.pageRef})</span>}
                            </div>
                            <span className="font-mono text-[11px] text-slate-400 whitespace-nowrap">{act.time}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error?.message || '알 수 없는 오류' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
              <div className="max-w-md w-full bg-white rounded-2xl border border-rose-200 p-6 shadow">
                <h2 className="text-lg font-extrabold text-rose-700">화면 렌더링 오류</h2>
                <p className="text-sm text-slate-700 mt-2">{this.state.errorMsg}</p>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
