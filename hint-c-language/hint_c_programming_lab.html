    function safeLoad(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed ?? fallback;
      } catch (err) {
        console.warn('localStorage load fallback for', key, err);
        return fallback;
      }
    }

    function safeSave(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (err) {
        console.warn('localStorage save error for', key, err);
      }
    }

    /* =========================================================================
       5. CLIENT-SIDE C EXECUTION ENGINE (Supports both Interactive Terminal
          async stdin pausing AND synchronous batch grading for Practice tests)
       ========================================================================= */
    function formatPrintf(fmt, args) {
      let argIdx = 0;
      let out = '';
      let i = 0;
      while (i < fmt.length) {
        if (fmt[i] === '%' && i + 1 < fmt.length) {
          if (fmt[i + 1] === '%') {
            out += '%';
            i += 2;
            continue;
          }
          const match = fmt.slice(i).match(/^%([-+0 #]*)(\d+)?(?:\.(\d+))?(?:l|ll|h)?([diuoxXfFeEgGaAcsp])/);
          if (match) {
            const fullSpec = match[0];
            const flags = match[1] || '';
            const width = match[2] ? parseInt(match[2], 10) : 0;
            const prec = match[3] !== undefined ? parseInt(match[3], 10) : null;
            const type = match[4];
            const val = args[argIdx++];
            let formatted = '';

            if (type === 'd' || type === 'i') {
              const num = Number.isFinite(Number(val)) ? Math.trunc(Number(val)) : 0;
              formatted = String(num);
            } else if (type === 'u') {
              const num = Number.isFinite(Number(val)) ? (Math.trunc(Number(val)) >>> 0) : 0;
              formatted = String(num);
            } else if (type === 'f' || type === 'F') {
              const num = Number.isFinite(Number(val)) ? Number(val) : 0;
              const p = prec !== null ? prec : 6;
              formatted = num.toFixed(p);
            } else if (type === 'c') {
              if (typeof val === 'string') formatted = val.charAt(0) || '';
              else if (typeof val === 'number') formatted = String.fromCharCode(val);
              else formatted = '';
            } else if (type === 's') {
              formatted = val !== undefined && val !== null ? String(val) : '(null)';
            } else if (type === 'p') {
              const addr = Number(val) || 0;
              formatted = addr === 0 ? '00000000' : '0x' + addr.toString(16).toUpperCase().padStart(8, '0');
            } else if (type === 'x' || type === 'X') {
              const num = (Math.trunc(Number(val)) >>> 0);
              formatted = type === 'X' ? num.toString(16).toUpperCase() : num.toString(16);
            } else {
              formatted = String(val ?? '');
            }

            if (width > formatted.length) {
              const padChar = flags.includes('0') && !flags.includes('-') ? '0' : ' ';
              const pad = padChar.repeat(width - formatted.length);
              formatted = flags.includes('-') ? formatted + pad : pad + formatted;
            }
            out += formatted;
            i += fullSpec.length;
            continue;
          }
        }
        out += fmt[i];
        i++;
      }
      return out;
    }

    function compileCProgram(sourceCode) {
      if (!sourceCode || !sourceCode.trim()) {
        return { error: '컴파일 오류: 소스 코드가 비어 있습니다.' };
      }

      let code = sourceCode
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/\/\/.*$/gm, '');

      const defines = {};
      code = code.replace(/^\s*#define\s+([A-Za-z_]\w*)\s+(.+)$/gm, (_, name, val) => {
        if (!name.startsWith('_CRT')) {
          defines[name] = val.trim();
        }
        return '';
      });

      code = code.replace(/^\s*#include\s*[<"][^>"]+[>"]/gm, '');

      for (const [k, v] of Object.entries(defines)) {
        const re = new RegExp(`\\b${k}\\b`, 'g');
        code = code.replace(re, `(${v})`);
      }

      if (!/\bmain\s*\(/.test(code)) {
        return { error: '링크 오류: main() 함수가 정의되어 있지 않습니다 (교재 p.85 참고).' };
      }

      const openBraces = (code.match(/\{/g) || []).length;
      const closeBraces = (code.match(/\}/g) || []).length;
      if (openBraces !== closeBraces) {
        return { error: `컴파일 오류: 중괄호 { } 짝이 맞지 않습니다 (여는 괄호 ${openBraces}개, 닫는 괄호 ${closeBraces}개).` };
      }

      const openParens = (code.match(/\(/g) || []).length;
      const closeParens = (code.match(/\)/g) || []).length;
      if (openParens !== closeParens) {
        return { error: `컴파일 오류: 소괄호 ( ) 짝이 맞지 않습니다 (여는 괄호 ${openParens}개, 닫는 괄호 ${closeParens}개).` };
      }

      // Remove forward function prototypes (e.g., void printBorder(int size);)
      code = code.replace(/^\s*(?:void|int|double|float|char|long|short)\s+[A-Za-z_]\w*\s*\([^;{}]*\)\s*;/gm, '');

      return { cleanedCode: code };
    }

    function createCInterpreterSession(sourceCode, options = {}) {
      const {
        initialStdin = '',
        interactive = false,
        onStdout = null,
        onNeedInput = null,
      } = options;

      let aborted = false;
      let inputBuffer = initialStdin || '';
      let waitResolvers = [];

      const emitStdout = (chunk) => {
        if (onStdout && chunk) onStdout(chunk);
      };

      const feedInput = (text) => {
        inputBuffer += text;
        const resolvers = waitResolvers.splice(0, waitResolvers.length);
        resolvers.forEach((fn) => fn());
      };

      const abort = () => {
        aborted = true;
        const resolvers = waitResolvers.splice(0, waitResolvers.length);
        resolvers.forEach((fn) => fn());
      };

      const waitForMoreInput = () => {
        if (!interactive) return Promise.resolve(false);
        if (aborted) return Promise.resolve(false);
        if (onNeedInput) onNeedInput();
        return new Promise((resolve) => {
          waitResolvers.push(() => resolve(!aborted));
        });
      };

      const run = async () => {
        const compiled = compileCProgram(sourceCode);
        if (compiled.error) {
          return { stdout: '', stderr: compiled.error, exitCode: 1 };
        }

        let code = compiled.cleanedCode;
        let stdout = '';
        let stepCounter = 0;
        const MAX_STEPS = 25000;

        const tick = () => {
          if (aborted) throw new Error('EXEC_ABORTED');
          stepCounter++;
          if (stepCounter > MAX_STEPS) {
            throw new Error('실행 시간 초과(무한 루프 방지): 반복 조건이나 break 문을 확인하세요 (교재 p.108).');
          }
        };

        const runtime = {
          mem: {},
          nextAddr: 0x1000,
          scopes: [{}],
          pushScope() {
            this.scopes.push({});
          },
          popScope() {
            if (this.scopes.length > 1) this.scopes.pop();

          alloc(name, type, initVal) {
            const addr = this.nextAddr;
            this.nextAddr += 4;

            return addr;
          },
          allocArray(name, elemType, size, initList = []) {
            const baseAddr = this.nextAddr;
            const len = Math.max(1, size);
            for (let i = 0; i < len; i++) {
              this.mem[baseAddr + i * 4] = initList[i] !== undefined ? initList[i] : (elemType === 'char' ? '\0' : 0);
            }
            this.nextAddr += len * 4;
            this.scopes[this.scopes.length - 1][name] = { addr: baseAddr, type: elemType, isArray: true, size: len };
            return baseAddr;
          },
          lookup(name) {
            for (let i = this.scopes.length - 1; i >= 0; i--) {

              }
            }
            return null;
          },
          getVal(name) {
            const sym = this.lookup(name);
            if (!sym) throw new Error(`선언되지 않은 식별자 '${name}' 입니다.`);
            if (sym.isArray) return sym.addr;
            return this.mem[sym.addr];
          },
          setVal(name, val) {
            const sym = this.lookup(name);
            if (!sym) throw new Error(`선언되지 않은 변수 '${name}' 에 대입할 수 없습니다.`);
            let castVal = val;
            if (sym.type === 'int' || sym.type === 'long' || sym.type === 'short') {
              castVal = Math.trunc(Number(val));
            }
            this.mem[sym.addr] = castVal;
            return castVal;
          },
          addrOf(name) {
            const sym = this.lookup(name);
            if (!sym) throw new Error(`주소 연산자(&) 대상 '${name}' 을 찾을 수 없습니다.`);
            return sym.addr;
          },
          deref(addr) {
            if (!addr || addr === 0) {
              throw new Error('런타임 오류: NULL 포인터(0x0000)를 역참조(*p)했습니다 (교재 p.210).');
            }
            if (!Object.prototype.hasOwnProperty.call(this.mem, addr)) {
              throw new Error(`런타임 오류: 유효하지 않은 메모리 주소(0x${Number(addr).toString(16)}) 접근입니다.`);
            }
            return this.mem[addr];
          },
          writeDeref(addr, val) {
            if (!addr || addr === 0) {
              throw new Error('런타임 오류: NULL 포인터(0x0000)에 값을 쓸 수 없습니다 (교재 p.210).');
            }
            this.mem[addr] = val;
            return val;
          },
          readString(baseAddr) {
            let s = '';
            for (let i = 0; i < 512; i++) {
              const ch = this.mem[baseAddr + i * 4];
              if (ch === undefined || ch === '\0' || ch === 0) break;
              s += typeof ch === 'number' ? String.fromCharCode(ch) : String(ch);
            }
            return s;
          },
          writeString(baseAddr, str) {
            const text = String(str ?? '');
            for (let i = 0; i < text.length; i++) {
              this.mem[baseAddr + i * 4] = text[i];
            }
            this.mem[baseAddr + text.length * 4] = '\0';
          },
        };

        const stdlib = {
          printf: (fmt, ...args) => {
            const piece = formatPrintf(String(fmt ?? ''), args);
            stdout += piece;
            emitStdout(piece);
            return piece.length;
          },
          scanf: async (fmt, ...addrs) => {
            const specs = String(fmt ?? '').match(/%(?:\d+)?(?:l|ll|h)?[diufcs]/g) || [];
            let count = 0;
            for (let i = 0; i < specs.length; i++) {
              const spec = specs[i];
              const addr = addrs[i];
              if (addr === undefined) {
                throw new Error('scanf() 인자가 부족하거나 변수 앞에 주소 연산자(&)가 누락되었습니다 (교재 p.81).');
              }
              if (spec.endsWith('c')) {
                while (inputBuffer.length === 0) {
                  const ok = await waitForMoreInput();
                  if (!ok) return count;
                }
                const ch = inputBuffer[0];
                inputBuffer = inputBuffer.slice(1);
                runtime.writeDeref(addr, ch);
                count++;
                continue;
              }
              while (true) {
                inputBuffer = inputBuffer.replace(/^\s+/, '');
                if (inputBuffer.length > 0) break;
                const ok = await waitForMoreInput();
                if (!ok) return count;
              }
              const tokenMatch = inputBuffer.match(/^(\S+)/);
              if (!tokenMatch) break;
              const token = tokenMatch[1];
              inputBuffer = inputBuffer.slice(token.length);

              if (spec.endsWith('s')) {
                runtime.writeString(addr, token);
              } else if (spec.endsWith('f')) {
                const num = parseFloat(token);
                runtime.writeDeref(addr, Number.isNaN(num) ? 0.0 : num);
              } else {
                const num = parseInt(token, 10);
                runtime.writeDeref(addr, Number.isNaN(num) ? 0 : num);
              }
              count++;
            }
            return count;
          },
          fgets: async (bufAddr, maxLen) => {
            while (inputBuffer.length === 0) {
              const ok = await waitForMoreInput();
              if (!ok) return 0;
            }
            const nlIdx = inputBuffer.indexOf('\n');
            let line = '';
            if (nlIdx === -1) {
              line = inputBuffer.slice(0, Math.max(0, maxLen - 1));
              inputBuffer = inputBuffer.slice(line.length);
            } else {
              line = inputBuffer.slice(0, Math.min(nlIdx + 1, Math.max(0, maxLen - 1)));
              inputBuffer = inputBuffer.slice(nlIdx + 1);
            }
            runtime.writeString(bufAddr, line);
            return bufAddr;
          },
          strlen: (addr) => runtime.readString(addr).length,
          strcmp: (a1, a2) => {
            const s1 = runtime.readString(a1);
            const s2 = runtime.readString(a2);
            return s1 === s2 ? 0 : s1 < s2 ? -1 : 1;
          },
          strcpy: (dst, src) => {
            runtime.writeString(dst, runtime.readString(src));
            return dst;
          },
          strcspn: (addr, reject) => {
            const s = runtime.readString(addr);
            const idx = s.indexOf(String(reject ?? '\n'));
            return idx === -1 ? s.length : idx;
          },
          sqrt: (x) => Math.sqrt(Number(x)),
          fabs: (x) => Math.abs(Number(x)),
          srand: () => {},
          time: () => Math.floor(Date.now() / 1000),
          rand: () => Math.floor(Math.random() * 32768),
        };

        // Parse top-level functions (including main)
        const funcRegex = /\b(void|int|double|float|char|long|short)\s+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*\{/g;
        const functions = {};
        let match;
        while ((match = funcRegex.exec(code)) !== null) {
          const retType = match[1];
          const funcName = match[2];
          const rawParams = match[3].trim();
          let depth = 1;
          let pos = funcRegex.lastIndex;
          while (pos < code.length && depth > 0) {
            if (code[pos] === '{') depth++;
            else if (code[pos] === '}') depth--;
            pos++;
          }
          const body = code.slice(funcRegex.lastIndex, pos - 1);
          const params = rawParams === '' || rawParams === 'void'
            ? []
            : rawParams.split(',').map((p) => {
                const cleaned = p.trim();
                const isArr = cleaned.endsWith('[]');
                const noBracket = cleaned.replace(/\[\]$/, '').trim();
                const isPtr = noBracket.includes('*');
                const parts = noBracket.replace(/\*/g, ' ').trim().split(/\s+/);
                const pName = parts[parts.length - 1];
                const pType = parts[0];
                return { name: pName, type: pType, isPtr: isPtr || isArr };
              });
          functions[funcName] = { retType, name: funcName, params, body };
          funcRegex.lastIndex = pos;
        }

        function splitTopLevel(str, sep) {
          const out = [];
          let cur = '';
          let p = 0, b = 0, c = 0;
          let inStr = false, inChar = false;
          for (let i = 0; i < str.length; i++) {
            const ch = str[i];
            if (ch === '"' && str[i - 1] !== '\\' && !inChar) inStr = !inStr;
            else if (ch === "'" && str[i - 1] !== '\\' && !inStr) inChar = !inChar;
            if (!inStr && !inChar) {
              if (ch === '(') p++;
              else if (ch === ')') p--;
              else if (ch === '[') b++;
              else if (ch === ']') b--;
              else if (ch === '{') c++;
              else if (ch === '}') c--;
              if (ch === sep && p === 0 && b === 0 && c === 0) {
                out.push(cur);
                cur = '';
                continue;
              }
            }
            cur += ch;
          }
          if (cur.trim()) out.push(cur);
          return out;
        }

        function splitStatements(block) {
          const stmts = [];
          let cur = '';
          let p = 0, b = 0, c = 0;
          let inStr = false, inChar = false;
          for (let i = 0; i < block.length; i++) {
            const ch = block[i];
            if (ch === '"' && block[i - 1] !== '\\' && !inChar) inStr = !inStr;
            else if (ch === "'" && block[i - 1] !== '\\' && !inStr) inChar = !inChar;
            cur += ch;
            if (!inStr && !inChar) {
              if (ch === '(') p++;
              else if (ch === ')') p--;
              else if (ch === '[') b++;
              else if (ch === ']') b--;
              else if (ch === '{') c++;
              else if (ch === '}') {
                c--;
                if (c === 0 && p === 0 && b === 0) {
                  // Check if followed by else
                  const rest = block.slice(i + 1);
                  if (/^\s*else\b/.test(rest)) continue;
                  stmts.push(cur.trim());
                  cur = '';
                }
              } else if (ch === ';' && c === 0 && p === 0 && b === 0) {
                // Keep single-line if(...) stmt; else stmt; together if followed by else
                const trimmed = cur.trim();
                if (/^if\s*\(/.test(trimmed)) {
                  const rest = block.slice(i + 1);
                  if (/^\s*else\b/.test(rest)) continue;
                }
                stmts.push(trimmed);
                cur = '';
              }
            }
          }
          if (cur.trim()) stmts.push(cur.trim());
          return stmts;
        }

        // Safely unquote C string literal into JS string
        function unquoteCString(lit) {
          const inner = lit.slice(1, -1);
          return inner
            .replace(/\\n/g, '\n')
            .replace(/\\t/g, '\t')
            .replace(/\\0/g, '\0')
            .replace(/\\"/g, '"')
            .replace(/\\\\/g, '\\');
        }

        // Convert char literal ('a', '\n', etc.) to ASCII number
        function charLiteralToCode(lit) {
          const inner = lit.slice(1, -1);
          if (inner === '\\n') return 10;
          if (inner === '\\t') return 9;
          if (inner === '\\0') return 0;
          if (inner === '\\\'') return 39;
          if (inner === '\\\\') return 92;
          return inner.charCodeAt(0) || 0;
        }

        // Call stdlib or user-defined C function cleanly without string-rewriting '__call'
        async function callCFunction(fnName, args) {
          const mappedArgs = args.map((a) => {
            if (typeof a === 'string' && ['strlen', 'strcmp', 'strcpy', 'strcspn'].includes(fnName)) {
              const tmpAddr = runtime.nextAddr;
              runtime.nextAddr += (a.length + 2) * 4;
              runtime.writeString(tmpAddr, a);
              return tmpAddr;
            }
            return a;
          });
          if (Object.prototype.hasOwnProperty.call(stdlib, fnName)) {
            return await stdlib[fnName](...mappedArgs);
          }
          if (Object.prototype.hasOwnProperty.call(functions, fnName)) {
            return await invokeFunction(functions[fnName], mappedArgs);
          }
          throw new Error(`정의되지 않은 함수 '${fnName}()' 호출입니다.`);
        }

        // Strip outer matching parentheses if they wrap the entire expression
        function stripOuterParens(s) {
          let cur = s.trim();
          while (cur.startsWith('(') && cur.endsWith(')')) {
            let depth = 0;
            let wrapsAll = true;
            for (let i = 0; i < cur.length; i++) {
              if (cur[i] === '(') depth++;
              else if (cur[i] === ')') {
                depth--;
                if (depth === 0 && i < cur.length - 1) {
                  wrapsAll = false;
                  break;
                }
              }
            }
            if (!wrapsAll || depth !== 0) break;
            cur = cur.slice(1, -1).trim();
          }
          return cur;
        }

        // Find top-level binary operator with lowest precedence (right-to-left or left-to-right)
        function findTopLevelOp(expr, ops, rightToLeft = false) {
          let p = 0, b = 0, c = 0;
          let inStr = false, inChar = false;
          const indices = [];
          for (let i = 0; i < expr.length; i++) {
            const ch = expr[i];
            if (ch === '"' && expr[i - 1] !== '\\' && !inChar) inStr = !inStr;
            else if (ch === "'" && expr[i - 1] !== '\\' && !inStr) inChar = !inChar;
            if (!inStr && !inChar) {
              if (ch === '(') p++;
              else if (ch === ')') p--;
              else if (ch === '[') b++;
              else if (ch === ']') b--;
              else if (ch === '{') c++;
              else if (ch === '}') c--;
              if (p === 0 && b === 0 && c === 0) {
                for (const op of ops) {
                  if (expr.slice(i, i + op.length) === op) {
                    // Avoid matching single '=' inside '==', '!=', '<=', '>='
                    if (op === '=') {
                      const prev = expr[i - 1];
                      const next = expr[i + 1];
                      if (prev === '=' || prev === '!' || prev === '<' || prev === '>' || next === '=') {
                        continue;
                      }
                    }
                    // Avoid matching single '&' inside '&&' or single '|' inside '||'
                    if (op === '&' && (expr[i + 1] === '&' || expr[i - 1] === '&')) continue;
                    if (op === '|' && (expr[i + 1] === '|' || expr[i - 1] === '|')) continue;
                    indices.push({ idx: i, op });
                    break;
                  }
                }
              }
            }
          }
          if (indices.length === 0) return null;
          return rightToLeft ? indices[indices.length - 1] : indices[0];
        }

        // Direct recursive C expression evaluator (no '__call' identifier rewriting)
        async function evalExpr(rawExpr) {
          const expr = stripOuterParens(String(rawExpr ?? ''));
          if (!expr) return 0;

          // 1. Top-level variable assignment / compound assignment: x = ..., x += ...
          const assignMatch = expr.match(/^([A-Za-z_]\w*)\s*(\+=|-=|\*=|\/=|%=|=)\s*([\s\S]+)$/);
          if (assignMatch && !expr.includes('==')) {
            const lhs = assignMatch[1];
            const op = assignMatch[2];
            const rhsVal = await evalExpr(assignMatch[3]);
            if (op === '=') {
              return runtime.setVal(lhs, rhsVal);
            }
            const cur = Number(runtime.getVal(lhs));
            const v = Number(rhsVal);
            let next = rhsVal;
            if (op === '+=') next = cur + v;
            else if (op === '-=') next = cur - v;
            else if (op === '*=') next = cur * v;
            else if (op === '/=') next = Math.trunc(cur / v);
            else if (op === '%=') next = cur % v;
            return runtime.setVal(lhs, next);
          }

          // 2. Pointer dereference assignment at top-level: *p = val
          if (/^\*\s*[A-Za-z_]\w*\s*=/.test(expr) && !expr.includes('==')) {
            const m = expr.match(/^\*\s*([A-Za-z_]\w*)\s*=\s*([\s\S]+)$/);
            if (m) {
              const addr = runtime.getVal(m[1]);
              const rhsVal = await evalExpr(m[2]);
              return runtime.writeDeref(addr, rhsVal);
            }
          }

          // 3. Array element assignment at top-level: arr[i] = val or arr[i] += val
          const arrAssignMatch = expr.match(/^([A-Za-z_]\w*)\s*\[((?:[^[\]]|\[[^\]]*\])+)\]\s*(\+=|-=|\*=|\/=|%=|=)\s*([\s\S]+)$/);
          if (arrAssignMatch && !expr.slice(0, arrAssignMatch.index).includes('==')) {
            const arrName = arrAssignMatch[1];
            const idxVal = Math.trunc(Number(await evalExpr(arrAssignMatch[2])));
            const op = arrAssignMatch[3];
            const rhsVal = await evalExpr(arrAssignMatch[4]);
            const sym = runtime.lookup(arrName);
            if (!sym) throw new Error(`배열 '${arrName}' 을 찾을 수 없습니다.`);
            const base = sym.isArray ? sym.addr : runtime.mem[sym.addr];
            if (sym.isArray && (idxVal < 0 || idxVal >= sym.size)) {
              throw new Error(`런타임 경고: 배열 '${arrName}[${idxVal}]' 인덱스 범위(0~${sym.size - 1})를 초과했습니다 (교재 p.131).`);
            }
            const targetAddr = base + idxVal * 4;
            if (op === '=') {
              runtime.mem[targetAddr] = rhsVal;
              return rhsVal;
            }
            const cur = Number(runtime.mem[targetAddr] ?? 0);
            const v = Number(rhsVal);
            let next = rhsVal;
            if (op === '+=') next = cur + v;
            else if (op === '-=') next = cur - v;
            else if (op === '*=') next = cur * v;
            else if (op === '/=') next = Math.trunc(cur / v);
            else if (op === '%=') next = cur % v;
            runtime.mem[targetAddr] = next;
            return next;
          }

          // 4. Precedence climbing from lowest to highest
          const precLevels = [
            ['||'],
            ['&&'],
            ['==', '!='],
            ['<=', '>=', '<', '>'],
            ['+', '-'],
            ['*', '/', '%'],
          ];

          for (const ops of precLevels) {
            const found = findTopLevelOp(expr, ops, false);
            if (found && found.idx > 0) {
              const leftStr = expr.slice(0, found.idx).trim();
              const rightStr = expr.slice(found.idx + found.op.length).trim();
              if (leftStr && rightStr) {
                const lVal = await evalExpr(leftStr);
                const rVal = await evalExpr(rightStr);
                switch (found.op) {
                  case '||': return (Number(lVal) !== 0 || Number(rVal) !== 0) ? 1 : 0;
                  case '&&': return (Number(lVal) !== 0 && Number(rVal) !== 0) ? 1 : 0;
                  case '==': return lVal === rVal ? 1 : 0;
                  case '!=': return lVal !== rVal ? 1 : 0;
                  case '<=': return Number(lVal) <= Number(rVal) ? 1 : 0;
                  case '>=': return Number(lVal) >= Number(rVal) ? 1 : 0;
                  case '<': return Number(lVal) < Number(rVal) ? 1 : 0;
                  case '>': return Number(lVal) > Number(rVal) ? 1 : 0;
                  case '+':
                    if (typeof lVal === 'string' || typeof rVal === 'string') {
                      return String(lVal) + String(rVal);
                    }
                    return Number(lVal) + Number(rVal);
                  case '-': return Number(lVal) - Number(rVal);
                  case '*': return Number(lVal) * Number(rVal);
                  case '/':
                    if (Number(rVal) === 0) throw new Error('런타임 오류: 0으로 나눌 수 없습니다.');
                    return Math.trunc(Number(lVal) / Number(rVal));
                  case '%':
                    if (Number(rVal) === 0) throw new Error('런타임 오류: 0으로 나눈 나머지를 구할 수 없습니다.');
                    return Math.trunc(Number(lVal)) % Math.trunc(Number(rVal));
                }
              }
            }
          }

          // 5. Unary prefix operators: !, ~, unary +, unary -, ++x, --x, &var, &arr[i], *ptr, (cast)expr
          if (expr.startsWith('!')) {
            const v = await evalExpr(expr.slice(1));
            return Number(v) === 0 ? 1 : 0;
          }
          if (expr.startsWith('++')) {
            const name = expr.slice(2).trim();
            const next = Number(runtime.getVal(name)) + 1;
            return runtime.setVal(name, next);
          }
          if (expr.startsWith('--')) {
            const name = expr.slice(2).trim();
            const next = Number(runtime.getVal(name)) - 1;
            return runtime.setVal(name, next);
          }
          if (expr.startsWith('+') && !expr.startsWith('++')) {
            return Number(await evalExpr(expr.slice(1)));
          }
          if (expr.startsWith('-') && !expr.startsWith('--')) {
            return -Number(await evalExpr(expr.slice(1)));
          }
          if (expr.startsWith('&')) {
            const target = expr.slice(1).trim();
            const arrRef = target.match(/^([A-Za-z_]\w*)\s*\[((?:[^[\]]|\[[^\]]*\])+)\]$/);
            if (arrRef) {
              const sym = runtime.lookup(arrRef[1]);
              if (!sym) throw new Error(`배열 '${arrRef[1]}' 을 찾을 수 없습니다.`);
              const idxVal = Math.trunc(Number(await evalExpr(arrRef[2])));
              return sym.addr + idxVal * 4;
            }
            const varMatch = target.match(/^\(?([A-Za-z_]\w*)\)?$/);
            if (varMatch) {
              return runtime.addrOf(varMatch[1]);
            }
          }
          if (expr.startsWith('*')) {
            const addr = await evalExpr(expr.slice(1));
            return runtime.deref(addr);
          }

          // C type casts: (double)x, (int)x, (unsigned int)x
          const castMatch = expr.match(/^\(\s*(?:unsigned\s+)?(int|long|short|char|double|float)\s*\)\s*([\s\S]+)$/);
          if (castMatch) {
            const castType = castMatch[1];
            const innerVal = await evalExpr(castMatch[2]);
            if (castType === 'double' || castType === 'float') return Number(innerVal);
            return Math.trunc(Number(innerVal));
          }

          // 6. Postfix ++ / -- : x++, x--
          const postIncMatch = expr.match(/^([A-Za-z_]\w*)\s*(\+\+|--)$/);
          if (postIncMatch) {
            const name = postIncMatch[1];
            const cur = Number(runtime.getVal(name));
            const delta = postIncMatch[2] === '++' ? 1 : -1;
            runtime.setVal(name, cur + delta);
            return cur;
          }

          // 7. Function call: fnName(arg1, arg2, ...)
          const fnCallMatch = expr.match(/^([A-Za-z_]\w*)\s*\(([\s\S]*)\)$/);
          if (fnCallMatch) {
            // Confirm closing paren matches index expr.length - 1
            let pDepth = 0;
            let matchesWhole = true;
            for (let i = fnCallMatch[1].length; i < expr.length; i++) {
              if (expr[i] === '(') pDepth++;
              else if (expr[i] === ')') {
                pDepth--;
                if (pDepth === 0 && i < expr.length - 1) {
                  matchesWhole = false;
                  break;
                }
              }
            }
            if (matchesWhole && pDepth === 0) {
              const fnName = fnCallMatch[1];
              const argStr = fnCallMatch[2].trim();
              const argTokens = argStr ? splitTopLevel(argStr, ',') : [];
              const argVals = [];
              for (const tok of argTokens) {
                argVals.push(await evalExpr(tok));
              }
              return await callCFunction(fnName, argVals);
            }
          }

          // 8. Array element read: arr[idx]
          const arrReadMatch = expr.match(/^([A-Za-z_]\w*)\s*\[((?:[^[\]]|\[[^\]]*\])+)\]$/);
          if (arrReadMatch) {
            const arrName = arrReadMatch[1];
            const idxVal = Math.trunc(Number(await evalExpr(arrReadMatch[2])));
            const sym = runtime.lookup(arrName);
            if (!sym) throw new Error(`배열 '${arrName}' 을 찾을 수 없습니다.`);
            const base = sym.isArray ? sym.addr : runtime.mem[sym.addr];
            if (sym.isArray && (idxVal < 0 || idxVal >= sym.size)) {
              throw new Error(`런타임 경고: 배열 '${arrName}[${idxVal}]' 인덱스 범위(0~${sym.size - 1})를 초과했습니다 (교재 p.131).`);
            }
            return runtime.mem[base + idxVal * 4];
          }

          // 9. Literals & identifiers
          if (/^"(?:\\.|[^"\\])*"$/.test(expr)) {
            return unquoteCString(expr);
          }
          if (/^'(?:\\.|[^'\\])'$/.test(expr)) {
            return charLiteralToCode(expr);
          }
          if (/^0[xX][0-9a-fA-F]+$/.test(expr)) {
            return parseInt(expr, 16);
          }
          if (/^\d+(?:\.\d+)?[fFlLuU]*$/.test(expr)) {
            const cleanNum = expr.replace(/[fFlLuU]+$/, '');
            return cleanNum.includes('.') ? parseFloat(cleanNum) : parseInt(cleanNum, 10);
          }
          if (expr === 'NULL') {
            return 0;
          }
          if (/^[A-Za-z_]\w*$/.test(expr)) {
            return runtime.getVal(expr);
          }

          throw new Error(`지원되지 않거나 잘못된 C 수식입니다: ${expr}`);
        }

        async function execBlock(blockCode) {
          const stmts = splitStatements(blockCode);
          for (const rawStmt of stmts) {
            tick();
            const stmt = rawStmt.trim();
            if (!stmt || stmt === ';') continue;

            // return statement
            if (/^return\b/.test(stmt)) {
              const expr = stmt.replace(/^return\b/, '').replace(/;$/, '').trim();
              const val = expr ? await evalExpr(expr) : undefined;
              return { type: 'return', value: val };
            }

            // break statement
            if (/^break\s*;?$/.test(stmt)) {
              return { type: 'break' };
            }

            // continue statement
            if (/^continue\s*;?$/.test(stmt)) {
              return { type: 'continue' };
            }

            // Variable / Array declaration: int a = 1, b[5] = {1,2};
            const declMatch = stmt.match(/^(?:unsigned\s+)?(int|double|float|char|long|short)\s+(.+);$/);
            if (declMatch) {
              const baseType = declMatch[1];
              const items = splitTopLevel(declMatch[2], ',');
              for (const item of items) {
                const trimmedItem = item.trim();
                const arrMatch = trimmedItem.match(/^([A-Za-z_]\w*)\s*\[([^\]]*)\]\s*(?:=\s*(.+))?$/);
                if (arrMatch) {
                  const arrName = arrMatch[1];
                  const rawSize = arrMatch[2].trim();
                  const initPart = arrMatch[3] ? arrMatch[3].trim() : null;
                  if (initPart && initPart.startsWith('"')) {
                    const strVal = JSON.parse(initPart);
                    const sz = rawSize ? Math.trunc(Number(await evalExpr(rawSize))) : strVal.length + 1;
                    const addr = runtime.allocArray(arrName, 'char', sz, []);
                    runtime.writeString(addr, strVal);
                  } else if (initPart && initPart.startsWith('{')) {
                    const inner = initPart.slice(1, -1);
                    const elems = splitTopLevel(inner, ',');
                    const evaluated = [];
                    for (const el of elems) {
                      evaluated.push(await evalExpr(el));
                    }
                    const sz = rawSize ? Math.trunc(Number(await evalExpr(rawSize))) : evaluated.length;
                    runtime.allocArray(arrName, baseType, sz, evaluated);
                  } else {
                    const sz = rawSize ? Math.trunc(Number(await evalExpr(rawSize))) : 1;
                    runtime.allocArray(arrName, baseType, sz, []);
                  }
                } else {
                  const cleanVar = trimmedItem.replace(/^\*\s*/, '');
                  const eqIdx = cleanVar.indexOf('=');
                  if (eqIdx === -1) {
                    runtime.alloc(cleanVar.trim(), baseType, 0);
                  } else {
                    const vName = cleanVar.slice(0, eqIdx).trim();
                    const vExpr = cleanVar.slice(eqIdx + 1).trim();
                    const vVal = await evalExpr(vExpr);
                    runtime.alloc(vName, baseType, vVal);
                  }
                }
              }
              continue;
            }

            // if / else if / else statement
            if (/^if\s*\(/.test(stmt)) {
              const res = await execIfChain(stmt);
              if (res && res.type !== 'none') return res;
              continue;
            }

            // while loop
            if (/^while\s*\(/.test(stmt)) {
              const condStart = stmt.indexOf('(');
              let p = 1, pos = condStart + 1;
              while (pos < stmt.length && p > 0) {
                if (stmt[pos] === '(') p++;
                else if (stmt[pos] === ')') p--;
                pos++;
              }
              const condExpr = stmt.slice(condStart + 1, pos - 1);
              let bodyPart = stmt.slice(pos).trim();
              if (bodyPart.startsWith('{') && bodyPart.endsWith('}')) {
                bodyPart = bodyPart.slice(1, -1);
              }
              while (Number(await evalExpr(condExpr)) !== 0) {
                tick();
                runtime.pushScope();
                const sig = await execBlock(bodyPart);
                runtime.popScope();
                if (sig && sig.type === 'break') break;
                if (sig && sig.type === 'return') return sig;
              }
              continue;
            }

            // for loop
            if (/^for\s*\(/.test(stmt)) {
              const condStart = stmt.indexOf('(');
              let p = 1, pos = condStart + 1;
              while (pos < stmt.length && p > 0) {
                if (stmt[pos] === '(') p++;
                else if (stmt[pos] === ')') p--;
                pos++;
              }
              const header = stmt.slice(condStart + 1, pos - 1);
              const parts = splitTopLevel(header, ';');
              const initPart = (parts[0] || '').trim();
              const condPart = (parts[1] || '1').trim();
              const stepPart = (parts[2] || '').trim();
              let bodyPart = stmt.slice(pos).trim();
              if (bodyPart.startsWith('{') && bodyPart.endsWith('}')) {
                bodyPart = bodyPart.slice(1, -1);
              }

              runtime.pushScope();
              if (initPart) {
                await execBlock(initPart.endsWith(';') ? initPart : initPart + ';');
              }
              while (Number(await evalExpr(condPart)) !== 0) {
                tick();
                runtime.pushScope();
                const sig = await execBlock(bodyPart);
                runtime.popScope();
                if (sig && sig.type === 'break') break;
                if (sig && sig.type === 'return') {
                  runtime.popScope();
                  return sig;
                }
                if (stepPart) {
                  await evalExpr(stepPart);
                }
              }
              runtime.popScope();
              continue;
            }

            // switch statement
            if (/^switch\s*\(/.test(stmt)) {
              const condStart = stmt.indexOf('(');
              let p = 1, pos = condStart + 1;
              while (pos < stmt.length && p > 0) {
                if (stmt[pos] === '(') p++;
                else if (stmt[pos] === ')') p--;
                pos++;
              }
              const switchVal = await evalExpr(stmt.slice(condStart + 1, pos - 1));
              let bodyPart = stmt.slice(pos).trim();
              if (bodyPart.startsWith('{') && bodyPart.endsWith('}')) {
                bodyPart = bodyPart.slice(1, -1);
              }
              const sections = bodyPart.split(/(?=\bcase\b|\bdefault\s*:)/g).map((s) => s.trim()).filter(Boolean);
              let matched = false;
              for (const sec of sections) {
                if (sec.startsWith('case ')) {
                  const colonIdx = sec.indexOf(':');
                  const caseExpr = sec.slice(5, colonIdx).trim();
                  const caseVal = await evalExpr(caseExpr);
                  if (matched || caseVal === switchVal) {
                    matched = true;
                    const sig = await execBlock(sec.slice(colonIdx + 1));
                    if (sig && sig.type === 'break') break;
                    if (sig && sig.type === 'return') return sig;
                  }
                } else if (sec.startsWith('default')) {
                  const colonIdx = sec.indexOf(':');
                  const sig = await execBlock(sec.slice(colonIdx + 1));
                  if (sig && sig.type === 'break') break;
                  if (sig && sig.type === 'return') return sig;
                }
              }
              continue;
            }

            // Expression statement
            const expr = stmt.replace(/;$/, '').trim();
            await evalExpr(expr);
          }
          return { type: 'none' };
        }

        async function execIfChain(chainStmt) {
          let rest = chainStmt.trim();
          while (rest.length > 0) {
            if (/^if\s*\(/.test(rest)) {
              const condStart = rest.indexOf('(');
              let p = 1, pos = condStart + 1;
              while (pos < rest.length && p > 0) {
                if (rest[pos] === '(') p++;
                else if (rest[pos] === ')') p--;
                pos++;
              }
              const condExpr = rest.slice(condStart + 1, pos - 1);
              let afterCond = rest.slice(pos).trim();
              let branchBody = '';
              if (afterCond.startsWith('{')) {
                let bDepth = 1, bPos = 1;
                while (bPos < afterCond.length && bDepth > 0) {
                  if (afterCond[bPos] === '{') bDepth++;
                  else if (afterCond[bPos] === '}') bDepth--;
                  bPos++;
                }
                branchBody = afterCond.slice(1, bPos - 1);
                rest = afterCond.slice(bPos).trim();
              } else {
                const semiIdx = afterCond.indexOf(';');
                branchBody = semiIdx === -1 ? afterCond : afterCond.slice(0, semiIdx + 1);
                rest = semiIdx === -1 ? '' : afterCond.slice(semiIdx + 1).trim();
              }

              if (Number(await evalExpr(condExpr)) !== 0) {
                runtime.pushScope();
                const sig = await execBlock(branchBody);
                runtime.popScope();
                return sig;
              }
              if (/^else\b/.test(rest)) {
                rest = rest.replace(/^else\b/, '').trim();
                continue;
              }
              break;
            } else {
              // Final else branch
              let branchBody = rest;
              if (branchBody.startsWith('{') && branchBody.endsWith('}')) {
                branchBody = branchBody.slice(1, -1);
              }
              runtime.pushScope();
              const sig = await execBlock(branchBody);
              runtime.popScope();
              return sig;
            }
          }
          return { type: 'none' };
        }

        async function invokeFunction(fnDef, args) {
          runtime.pushScope();
          for (let i = 0; i < fnDef.params.length; i++) {
            const p = fnDef.params[i];
            runtime.alloc(p.name, p.type, args[i] !== undefined ? args[i] : 0);
          }
          const sig = await execBlock(fnDef.body);
          runtime.popScope();
          return sig && sig.type === 'return' ? sig.value : 0;
        }

        try {
          const exitCode = await invokeFunction(functions.main, []);
          return {
            stdout,
            stderr: '',
            exitCode: typeof exitCode === 'number' ? exitCode : 0,
          };
        } catch (err) {
          if (err && err.message === 'EXEC_ABORTED') {
            return { stdout, stderr: '사용자에 의해 실행이 중지되었습니다.', exitCode: 130 };
          }
          return {
            stdout,
            stderr: err?.message || '실행 중 오류가 발생했습니다.',
            exitCode: 1,
          };
        }
      };

      return { run, feedInput, abort };
    }

    async function executeCProgram(sourceCode, stdinText = '') {
      const session = createCInterpreterSession(sourceCode, {
        initialStdin: stdinText,
        interactive: false,
      });
      return await session.run();
    }

      }, [loopN]);

    /* =========================================================================
       7. CODE EDITOR + UNIFIED INTERACTIVE TERMINAL COMPONENT
          (Visual Studio Debug Console style: inline scanf/fgets input + echo)
       ========================================================================= */
    function CodeWorkbench({
      code,
      onChangeCode,
      snippets,
      onSaveSnippet,
      onLoadSnippet,
      compactTitle,
      onExecutionComplete,
      externalRunTrigger,
    }) {
      const [snippetTitle, setSnippetTitle] = useState('');
      const [showVsGuide, setShowVsGuide] = useState(false);
      const [copied, setCopied] = useState(false);

      // Unified interactive terminal state
      const [terminalEntries, setTerminalEntries] = useState([]);
      const [isRunning, setIsRunning] = useState(false);
      const [awaitingInput, setAwaitingInput] = useState(false);
      const [terminalInput, setTerminalInput] = useState('');

      const sessionRef = useRef(null);
      const terminalBodyRef = useRef(null);
      const terminalInputRef = useRef(null);

      const lineCount = useMemo(() => Math.max(1, (code || '').split('\n').length), [code]);

      // Auto-scroll terminal to bottom whenever entries or input prompt updates
      useEffect(() => {
        if (terminalBodyRef.current) {
          terminalBodyRef.current.scrollTop = terminalBodyRef.current.scrollHeight;
        }
      }, [terminalEntries, awaitingInput, isRunning]);

      // Focus inline terminal input automatically when scanf/fgets pauses
      useEffect(() => {
        if (awaitingInput && terminalInputRef.current) {
          terminalInputRef.current.focus();
        }
      }, [awaitingInput]);

      // Cleanup active interpreter session on unmount
      useEffect(() => {
        return () => {
          if (sessionRef.current) {
            sessionRef.current.abort();
          }
        };
      }, []);

      const appendTerminalChunk = useCallback((kind, text) => {
        setTerminalEntries((prev) => {
          if (prev.length > 0 && prev[prev.length - 1].kind === kind && (kind === 'stdout' || kind === 'echo')) {
            const copy = [...prev];
            copy[copy.length - 1] = { ...copy[copy.length - 1], text: copy[copy.length - 1].text + text };
            return copy;
          }
          return [...prev, { id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), kind, text }];
        });
      }, []);

      const handleRunInteractive = useCallback(async () => {
        if (sessionRef.current) {
          sessionRef.current.abort();
          sessionRef.current = null;
        }

        setTerminalInput('');
        setAwaitingInput(false);
        setIsRunning(true);
        setTerminalEntries([
          {
            id: 'hdr_' + Date.now(),
            kind: 'system',
            text: '> ./main  (Visual Studio 디버그 콘솔 모드)\n',
          },
        ]);

        const session = createCInterpreterSession(code, {
          interactive: true,
          onStdout: (chunk) => {
            appendTerminalChunk('stdout', chunk);
          },
          onNeedInput: () => {
            setAwaitingInput(true);
          },
        });

        sessionRef.current = session;
        const result = await session.run();

        if (sessionRef.current === session) {
          sessionRef.current = null;
          setAwaitingInput(false);
          setIsRunning(false);

          if (result.stderr) {
            appendTerminalChunk('stderr', `\n${result.stderr}\n`);
          }
          appendTerminalChunk(
            'footer',
            `\n[프로세스 종료됨 · 반환 코드: ${result.exitCode}]\n`
          );
          if (onExecutionComplete) {
            onExecutionComplete(result);
          }
        }
      }, [code, appendTerminalChunk, onExecutionComplete]);

      useEffect(() => {
        if (externalRunTrigger && externalRunTrigger > 0) {
          handleRunInteractive();
        }
      }, [externalRunTrigger]);

      const handleStopExecution = () => {
        if (sessionRef.current) {
          sessionRef.current.abort();
        }
      };

      const handleClearTerminal = () => {
        if (isRunning && sessionRef.current) {
          sessionRef.current.abort();
        }
        setTerminalEntries([]);
        setTerminalInput('');
        setAwaitingInput(false);
      };

      const submitTerminalLine = (rawLine) => {
        if (!sessionRef.current || !awaitingInput) return;
        const payload = rawLine + '\n';
        // Echo user's typed value directly into the terminal stream on the same line
        appendTerminalChunk('echo', payload);
        setTerminalInput('');
        setAwaitingInput(false);
        sessionRef.current.feedInput(payload);
      };

      const handleTerminalKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitTerminalLine(terminalInput);
        }
      };

      const handleTerminalPaste = (e) => {
        const pasted = e.clipboardData?.getData('text') || '';
        if (pasted.includes('\n')) {
          e.preventDefault();
          const combined = terminalInput + pasted;
          const normalized = combined.endsWith('\n') ? combined : combined + '\n';
          appendTerminalChunk('echo', normalized);
          setTerminalInput('');
          setAwaitingInput(false);
          sessionRef.current?.feedInput(normalized);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          const next = code.substring(0, start) + '    ' + code.substring(end);
          onChangeCode(next);
          requestAnimationFrame(() => {
            e.target.selectionStart = e.target.selectionEnd = start + 4;
          });
        } else if (e.key === 'Enter') {
          const start = e.target.selectionStart;
          const before = code.substring(0, start);
          const lastLine = before.split('\n').pop() || '';
          const indentMatch = lastLine.match(/^\s*/);
          let indent = indentMatch ? indentMatch[0] : '';
          if (lastLine.trimEnd().endsWith('{')) indent += '    ';
          if (indent.length > 0) {
            e.preventDefault();
            const end = e.target.selectionEnd;
            const next = before + '\n' + indent + code.substring(end);
            onChangeCode(next);
            requestAnimationFrame(() => {
              e.target.selectionStart = e.target.selectionEnd = start + 1 + indent.length;
            });
          }
        }
      };

      const handleCopy = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = code;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        } catch (err) {
          console.warn('Copy failed:', err);
        }
      };

      const handleSaveClick = () => {
        const title = snippetTitle.trim() || `내 C 코드 (${new Date().toLocaleTimeString('ko-KR')})`;
        onSaveSnippet(title, code, '');
        setSnippetTitle('');
      };

      return (
        <div className="bg-editor-900 text-slate-100 rounded-2xl border border-editor-700 overflow-hidden shadow-md flex flex-col">
          {/* Top toolbar */}
          <div className="px-3.5 py-2.5 bg-editor-950 border-b border-editor-700 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <span className={`inline-block w-2.5 h-2.5 rounded-full ${isRunning ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`} />
              <span className="text-xs font-mono font-semibold text-slate-200">
                {compactTitle || 'main.c · C Editor'}
              </span>
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <button
                onClick={handleRunInteractive}
                className="px-3 py-1 rounded-lg bg-mobility-500 hover:bg-mobility-600 text-white text-xs font-bold transition"
              >
                ▶ 실행 (Ctrl+F5)
              </button>
              {isRunning && (
                <button
                  onClick={handleStopExecution}
                  className="px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition"
                >
                  ■ 중지
                </button>
              )}
              <button
                onClick={handleCopy}
                className="px-2.5 py-1 rounded-lg bg-editor-800 hover:bg-editor-700 text-slate-200 text-xs font-medium border border-editor-700 transition"
              >
                {copied ? '복사됨' : '복사'}
              </button>
              <button
                onClick={() => onChangeCode('#include <stdio.h>\n\nint main(void) {\n    printf("Hello, HINT C Lab!\\n");\n    return 0;\n}')}
                className="px-2.5 py-1 rounded-lg bg-editor-800 hover:bg-editor-700 text-slate-200 text-xs font-medium border border-editor-700 transition"
              >
                초기화
              </button>
              <button
                onClick={() => setShowVsGuide((v) => !v)}
                className="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 text-xs font-semibold border border-amber-400/40 transition"
              >
                VS 실행 차이 안내
              </button>
            </div>
          </div>

          {/* Visual Studio difference banner */}
          {showVsGuide && (
            <div className="p-3 bg-amber-950/60 border-b border-amber-700/50 text-xs text-amber-100 space-y-1">
              <div className="font-bold text-amber-300">Visual Studio 실행 차이 안내 (교재 p.35~47, p.83)</div>
              <p>• <strong>main.c vs main.cpp</strong>: 새 항목 생성 시 기본 확장자가 .cpp로 잡힐 수 있으므로 C언어 학습 시 .c 파일로 지정하세요(p.35~36).</p>
              <p>• <strong>인코딩 &amp; _CRT_SECURE_NO_WARNINGS</strong>: Visual Studio 환경의 인코딩 설정과 scanf 보안 경고 안내를 확인하세요(p.38, p.83).</p>
              <p>• <strong>Windows API</strong>: 교재 p.42, p.44의 Sleep() 등은 Windows 환경 전용 헤더/함수이며, 웹 컴파일러에서는 표준 C 입출력·연산·포인터·배열·함수를 중심으로 실행됩니다.</p>
            </div>
          )}

          {/* Code editor with line numbers */}
          <div className="flex min-h-[220px] max-h-[340px] overflow-auto bg-editor-900">
            <div
              aria-hidden="true"
              className="py-3 px-2.5 text-right select-none bg-editor-950/70 text-slate-500 font-mono text-xs leading-6 border-r border-editor-800 min-w-[42px]"
            >
              {Array.from({ length: lineCount }, (_, idx) => (
                <div key={idx}>{idx + 1}</div>
              ))}
            </div>
            <textarea
              value={code}
              onChange={(e) => onChangeCode(e.target.value)}
              onKeyDown={handleKeyDown}
              spellCheck={false}
              aria-label="C 코드 편집기"
              className="code-font flex-1 w-full p-3 bg-transparent text-slate-100 text-xs leading-6 focus:outline-none resize-none"
            />
          </div>

          {/* Unified Interactive Debug Console Terminal */}
          <div className="border-t border-editor-700 bg-[#070B14] flex flex-col">
            <div className="px-3.5 py-2 bg-editor-950 border-b border-editor-800 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono font-bold text-sky-300">
                  디버그 콘솔 터미널 (Interactive Terminal)
                </span>
                {awaitingInput && (
                  <span className="text-[11px] font-mono px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/40 animate-pulse">
                    입력 대기 중 (타이핑 후 Enter)
                  </span>
                )}
              </div>
              <div className="flex items-center gap-1.5">
                {isRunning && (
                  <button
                    onClick={handleStopExecution}
                    className="px-2.5 py-1 rounded-md bg-rose-600/90 hover:bg-rose-500 text-white text-[11px] font-bold"
                  >
                    중지 (Stop)
                  </button>
                )}
                <button
                  onClick={handleClearTerminal}
                  className="px-2.5 py-1 rounded-md bg-editor-800 hover:bg-editor-700 text-slate-300 text-[11px] font-semibold border border-editor-700"
                >
                  터미널 지우기 (Clear)
                </button>
              </div>
            </div>

            <div
              ref={terminalBodyRef}
              onClick={() => {
                if (awaitingInput && terminalInputRef.current) {
                  terminalInputRef.current.focus();
                }
              }}
              className="p-3.5 font-mono text-xs leading-6 min-h-[175px] max-h-[270px] overflow-y-auto cursor-text select-text"
            >
              {terminalEntries.length === 0 ? (
                <div className="text-slate-500">
                  <div>&gt; 상단의 <span className="text-sky-300 font-semibold">[▶ 실행 (Ctrl+F5)]</span> 버튼을 누르면 Visual Studio 디버그 콘솔처럼 실행됩니다.</div>
                  <div className="mt-1 text-[11px]">• <code>scanf()</code>나 <code>fgets()</code>를 만나면 해당 줄 끝에 커서가 깜빡이며 직접 값을 입력할 수 있습니다.</div>
                </div>
              ) : (
                <div className="whitespace-pre-wrap break-words">
                  {terminalEntries.map((entry) => {
                    if (entry.kind === 'system') {
                      return (
                        <span key={entry.id} className="text-slate-400 font-semibold">
                          {entry.text}
                        </span>
                      );
                    }
                    if (entry.kind === 'stdout') {
                      return (
                        <span key={entry.id} className="text-slate-100">
                          {entry.text}
                        </span>
                      );
                    }
                    if (entry.kind === 'echo') {
                      return (
                        <span key={entry.id} className="text-emerald-300 font-bold">
                          {entry.text}
                        </span>
                      );
                    }
                    if (entry.kind === 'stderr') {
                      return (
                        <div
                          key={entry.id}
                          className="my-2 p-2.5 rounded-xl bg-rose-950/70 border border-rose-500/50 text-rose-300 whitespace-pre-wrap"
                        >
                          {entry.text.trim()}
                        </div>
                      );
                    }
                    return (
                      <span key={entry.id} className="text-sky-400/80 text-[11px]">
                        {entry.text}
                      </span>
                    );
                  })}

                  {/* Inline terminal input prompt right at the end of current printf line */}
                  {awaitingInput && (
                    <span className="inline-flex items-center align-baseline max-w-full">
                      <input
                        ref={terminalInputRef}
                        type="text"
                        value={terminalInput}
                        onChange={(e) => setTerminalInput(e.target.value)}
                        onKeyDown={handleTerminalKeyDown}
                        onPaste={handleTerminalPaste}
                        placeholder="값 입력 후 Enter..."
                        aria-label="터미널 표준 입력"
                        style={{ width: `${Math.max(14, terminalInput.length + 3)}ch` }}
                        className="bg-emerald-950/50 text-emerald-200 font-mono text-xs px-1.5 py-0.5 rounded border border-emerald-500/60 focus:outline-none focus:border-emerald-400 max-w-full"
                      />
                      <span className="terminal-cursor text-emerald-400 font-bold ml-0.5">█</span>
                    </span>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* LocalStorage Snippet Save / Load */}
          {snippets && onSaveSnippet && (
            <div className="p-3 bg-editor-900 border-t border-editor-800 flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex items-center gap-2 flex-1 min-w-[200px]">
                <input
                  type="text"
                  value={snippetTitle}
                  onChange={(e) => setSnippetTitle(e.target.value)}
                  placeholder="저장할 코드 제목 입력..."
                  className="px-2.5 py-1 rounded-lg bg-editor-950 border border-editor-700 text-slate-100 text-xs flex-1 focus:outline-none"
                />
                <button
                  onClick={handleSaveClick}
                  className="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold"
                >
                  저장
                </button>
              </div>
              <div className="flex items-center gap-1.5 flex-wrap">
                {snippets.slice(0, 4).map((sn) => (
                  <button
                    key={sn.id}
                    onClick={() => onLoadSnippet(sn)}
                    className="px-2 py-1 rounded-md bg-editor-800 hover:bg-editor-700 text-slate-200 border border-editor-700"
                    title="불러오기"
                  >
                    {sn.title}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =========================================================================
       8. MAIN APPLICATION WITH ALL 6 MENUS & 2-COLUMN RESPONSIVE WORKBENCH
       ========================================================================= */
    function App() {
      const [activeMenu, setActiveMenu] = useState('theory');
      const [selectedLessonId, setSelectedLessonId] = useState('u1_intro');
      const [selectedVizId, setSelectedVizId] = useState('exec_flow');
      const [selectedProblemId, setSelectedProblemId] = useState(PRACTICE_PROBLEMS[0].id);
      const [practiceFilterLevel, setPracticeFilterLevel] = useState(0);

      // Persistent states
      const [progress, setProgress] = useState(() => safeLoad(STORAGE_KEYS.progress, DEFAULT_PROGRESS));
      const [practiceState, setPracticeState] = useState(() => safeLoad(STORAGE_KEYS.practice, DEFAULT_PRACTICE));
      const [quizState, setQuizState] = useState(() => safeLoad(STORAGE_KEYS.quiz, DEFAULT_QUIZ));
      const [snippets, setSnippets] = useState(() => safeLoad(STORAGE_KEYS.snippets, DEFAULT_SNIPPETS));

      // Editor & runner state
      const [code, setCode] = useState(() => safeLoad(STORAGE_KEYS.editorDraft, LESSONS[0].practiceSample));

      // Lesson inline quiz answer state
      const [lessonQuizPick, setLessonQuizPick] = useState(null);

      // Practice state
      const [hintLevel, setHintLevel] = useState(0);
      const [showSolution, setShowSolution] = useState(false);
      const [gradingResults, setGradingResults] = useState(null);
      const [isGrading, setIsGrading] = useState(false);

      // Quiz & Review state
      const [quizMode, setQuizMode] = useState('all'); // 'all' | 'random' | 'wrong'
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizSelected, setQuizSelected] = useState('');
      const [quizFeedback, setQuizFeedback] = useState(null);

      useEffect(() => { safeSave(STORAGE_KEYS.progress, progress); }, [progress]);
      useEffect(() => { safeSave(STORAGE_KEYS.practice, practiceState); }, [practiceState]);
      useEffect(() => { safeSave(STORAGE_KEYS.quiz, quizState); }, [quizState]);
      useEffect(() => { safeSave(STORAGE_KEYS.snippets, snippets); }, [snippets]);
      useEffect(() => { safeSave(STORAGE_KEYS.editorDraft, code); }, [code]);

      const logActivity = useCallback((actionText, pageRef = '') => {
        setProgress((prev) => ({
          ...prev,
          lastVisited: { menu: activeMenu, lessonId: selectedLessonId, updatedAt: new Date().toISOString() },
          activityLog: [
            { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), text: actionText, pageRef, time: new Date().toLocaleTimeString('ko-KR') },
            ...(prev.activityLog || []),
          ].slice(0, 25),
        }));
      }, [activeMenu, selectedLessonId]);

      const currentLesson = useMemo(
        () => LESSONS.find((l) => l.id === selectedLessonId) || LESSONS[0],
        [selectedLessonId]
      );

      const currentProblem = useMemo(
        () => PRACTICE_PROBLEMS.find((p) => p.id === selectedProblemId) || PRACTICE_PROBLEMS[0],
        [selectedProblemId]
      );

      const activeQuizList = useMemo(() => {
        if (quizMode === 'wrong') {
          const filtered = QUIZ_BANK.filter((q) => (quizState.wrongIds || []).includes(q.id));
          return filtered.length > 0 ? filtered : QUIZ_BANK;
        }
        if (quizMode === 'random') {
          return [...QUIZ_BANK].sort(() => Math.random() - 0.5).slice(0, 5);
        }
        return QUIZ_BANK;
      }, [quizMode, quizState.wrongIds]);

      const handleSendToCompiler = (sampleCode, pageRef = '') => {
        setCode(sampleCode);
        setActiveMenu('compiler');
        logActivity('실습 예제를 C 실습실로 불러옴', pageRef);
      };

      const handleToggleComplete = (lessonId, pageRef) => {
        setProgress((prev) => {
          const exists = prev.completedLessons.includes(lessonId);
          const next = exists
            ? prev.completedLessons.filter((id) => id !== lessonId)
            : [...prev.completedLessons, lessonId];
          return { ...prev, completedLessons: next };
        });
        logActivity('단원 학습 완료 상태 변경', pageRef);
      };

      const handleGradeProblem = async () => {
        setIsGrading(true);
        const cases = [];
        for (const tc of currentProblem.testCases) {
          const res = await executeCProgram(code, tc.input);
          const actual = (res.stdout || '').trim();
          const expected = tc.expected.trim();
          const passed = !res.stderr && actual === expected;
          cases.push({ ...tc, actual, stderr: res.stderr, passed });
        }
        const allPassed = cases.every((c) => c.passed);
        setGradingResults(cases);
        setIsGrading(false);

        setPracticeState((prev) => {
          const nextSolved = allPassed && !prev.solvedIds.includes(currentProblem.id)
            ? [...prev.solvedIds, currentProblem.id]
            : prev.solvedIds;
          return {
            solvedIds: nextSolved,
            attempts: {
              ...prev.attempts,
              [currentProblem.id]: {
                passed: allPassed,
                code,
                updatedAt: new Date().toLocaleTimeString('ko-KR'),
              },
            },
          };
        });
        logActivity(`문제 채점 (${currentProblem.title}): ${allPassed ? '통과' : '재시도 필요'}`, currentProblem.pageRef);
      };

      const handleSelectProblem = (prob) => {
        setSelectedProblemId(prob.id);
        setCode(prob.sampleCode);
        setHintLevel(0);
        setShowSolution(false);
        setGradingResults(null);
      };

      const handleSubmitQuiz = () => {
        const q = activeQuizList[quizIndex % activeQuizList.length];
        if (!q || !quizSelected) return;
        const isCorrect = quizSelected === q.answer;
        setQuizFeedback({ isCorrect, explanation: q.explanation, answer: q.answer });

        setQuizState((prev) => {
          const nextWrong = isCorrect
            ? (prev.wrongIds || []).filter((id) => id !== q.id)
            : Array.from(new Set([...(prev.wrongIds || []), q.id]));
          return {
            wrongIds: nextWrong,
            history: [
              {
                id: q.id,
                unit: q.unit,
                type: q.type,
                correct: isCorrect,
                pageRef: q.pageRef,
                timestamp: new Date().toLocaleTimeString('ko-KR'),
              },
              ...(prev.history || []),
            ].slice(0, 60),
          };
        });
        logActivity(`퀴즈 풀이 (${q.type}): ${isCorrect ? '정답' : '오답'}`, q.pageRef);
      };

      const handleExportJson = () => {
        try {
          const payload = {
            exportedAt: new Date().toISOString(),
            progress,
            practice: practiceState,
            quiz: quizState,
            snippets,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'hint-c-lab-progress.json';
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          console.warn('Export error:', err);
        }
      };

      const handleResetAllData = () => {
        Object.values(STORAGE_KEYS).forEach((k) => {
          try { window.localStorage.removeItem(k); } catch (_) {}
        });
        setProgress(DEFAULT_PROGRESS);
        setPracticeState(DEFAULT_PRACTICE);
        setQuizState(DEFAULT_QUIZ);
        setSnippets(DEFAULT_SNIPPETS);
        setCode(LESSONS[0].practiceSample);
      };

      const overallPercent = Math.round((progress.completedLessons.length / LESSONS.length) * 100);
      const quizAccuracy = useMemo(() => {
        if (!quizState.history || quizState.history.length === 0) return 0;
        const ok = quizState.history.filter((h) => h.correct).length;
        return Math.round((ok / quizState.history.length) * 100);
      }, [quizState.history]);

      const navItems = [
        { id: 'theory', label: '이론 학습', sub: 'Theory' },
        { id: 'compiler', label: 'C 실습실', sub: 'Compiler' },
        { id: 'viz', label: '시각화 학습', sub: 'Visualization' },
        { id: 'practice', label: '문제 풀이', sub: 'Practice' },
        { id: 'quiz', label: '시험 및 복습', sub: 'Quiz & Review' },
        { id: 'progress', label: '학습 기록', sub: 'Progress' },
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          {/* Global Top Navigation Bar */}
          <header className="bg-navy-800 text-white border-b border-navy-700 sticky top-0 z-30 shadow-sm">
            <div className="max-w-[1440px] mx-auto px-3 sm:px-6 py-2.5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-mobility-500 flex items-center justify-center font-mono font-extrabold text-sm shadow">
                    C
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold tracking-tight text-sm sm:text-base">
                        HINT C Programming Lab
                      </span>
                      <span className="hidden sm:inline-block text-[11px] font-mono px-2 py-0.5 rounded-full bg-navy-700 text-sky-200">
                        강의자료.pdf · 234p
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-300">
                      현대자동차 HINT 모빌리티 SW 아카데미 실습 플랫폼
                    </div>
                  </div>
                </div>
                <div className="lg:hidden text-xs font-mono bg-navy-700 px-2.5 py-1 rounded-lg">
                  진도 {overallPercent}%
                </div>
              </div>

              {/* 6 Top-Level Menus */}
              <nav className="flex items-center gap-1 overflow-x-auto pb-1 lg:pb-0" aria-label="주 메뉴">
                {navItems.map((item) => {
                  const active = activeMenu === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveMenu(item.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition ${
                        active
                          ? 'bg-mobility-500 text-white shadow'
                          : 'text-slate-200 hover:bg-navy-700'
                      }`}
                    >
