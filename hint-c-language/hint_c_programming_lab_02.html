// 이진 탐색 함수 (배열이 오름차순 정렬되어 있어야 함)
int binary_search(const int list[], int n, int key)
{
    int low = 0, high = n - 1, middle;
    while (low <= high) {
        middle = (low + high) / 2;
        if (key == list[middle]) return middle;
        else if (key > list[middle]) low = middle + 1;
        else high = middle - 1;
    }
    return -1;
}

int main(void)
{
    int sensor_table[] = { 10, 20, 35, 50, 75, 90, 105, 120 };
    int size = sizeof(sensor_table) / sizeof(sensor_table[0]);
    int idx = binary_search(sensor_table, size, 75);

    return 0;

// Dynamically expand the question bank to 105 varied items based on textbook rules & formulas
function buildFullQuestionBank() {
  const bank = [...BASE_QUESTIONS];
  // Add 55 programmatic textbook-aligned questions (Bitwise math, Type sizes, Shift, MISRA rules, Arrays)
  const bitPairs = [
    [12, 10], [15, 9], [24, 18], [45, 27], [0x5A, 0x3C], [0xF0, 0xAA], [19, 7], [33, 15], [60, 21], [85, 51]
  ];
  bitPairs.forEach(([a, b], idx) => {
    const ops = [
      { sym: '&', name: '비트 AND(&)', res: a & b },
      { sym: '|', name: '비트 OR(|)', res: a | b },
      { sym: '^', name: '비트 XOR(^)', res: a ^ b }
    ];
    const op = ops[idx % 3];
    const wrong1 = (op.res ^ 0x05) & 0xFF;
    const wrong2 = (op.res + 2) & 0xFF;
    const wrong3 = (~op.res) & 0xFF;
    const opts = [String(op.res), String(wrong1), String(wrong2), String(wrong3)];
    // Deduplicate options safely
    const uniqueOpts = Array.from(new Set(opts));
    while (uniqueOpts.length < 4) uniqueOpts.push(String((uniqueOpts.length + 1) * 7));
    bank.push({
      id: `Q${String(51 + idx).padStart(3, '0')}`,
      unitId: 'bit-2',
      source: '01. C프로그래밍.pdf p.248~253 & 03. 비트 필드와 비트 연산.pdf p.7',
      type: 'code',
      q: `부호 없는 8비트 정수 A = ${a} (0x${a.toString(16).toUpperCase()}), B = ${b} (0x${b.toString(16).toUpperCase()})일 때 ${op.name} 연산(A ${op.sym} B)의 10진수 결과는?`,
      options: uniqueOpts,
      ans: 0,
      exp: `A=${a}(${a.toString(2).padStart(8,'0')})와 B=${b}(${b.toString(2).padStart(8,'0')})에 대해 ${op.sym} 연산을 수행하면 ${op.res.toString(2).padStart(8,'0')} (10진수 ${op.res})입니다.`
    });
  });

  // Shift & Bit-field width questions (15 items)
  for (let i = 0; i < 15; i++) {
    const width = (i % 6) + 2; // 2..7 bits
    const maxVal = (1 << width) - 1;
    bank.push({
      id: `Q${String(61 + i).padStart(3, '0')}`,
      unitId: 'bit-1',
      source: '03. 비트 필드와 비트 연산.pdf p.3',
      type: 'mcq',
      q: `구조체 멤버로 선언된 unsigned int field : ${width}; 비트 필드가 저장할 수 있는 최댓값은 얼마인가?`,
      options: [String(maxVal), String(maxVal + 1), String(width * 2), String(maxVal - 1)],
      ans: 0,
      exp: `교재 p.3에 따라 폭이 n인 unsigned 비트 필드에는 0부터 2^n - 1까지 저장할 수 있으므로 2^${width} - 1 = ${maxVal}입니다.`
    });
  }

  // Sensor frame extraction & control word questions (15 items)
  const frames = [0x94, 0xC7, 0x6A, 0xE1, 0x3F, 0xA8, 0x53, 0xD9, 0x4C, 0x8E, 0x71, 0xB5, 0x29, 0xF2, 0x65];
  frames.forEach((fr, idx) => {
    const mode = (fr >> 5) & 0x07;
    const ch = fr & 0x1F;
    const askMode = idx % 2 === 0;
    const correct = askMode ? mode : ch;
    const opts = Array.from(new Set([
      String(correct),
      String((correct + 3) & 0x1F),
      String((fr >> 4) & 0x0F),
      String((correct ^ 0x03) & 0x1F)
    ]));
    while (opts.length < 4) opts.push(String(opts.length + 11));
    bank.push({
      id: `Q${String(76 + idx).padStart(3, '0')}`,
      unitId: 'bit-2',
      source: '03. 비트 필드와 비트 연산.pdf p.9',
      type: 'code',
      q: `1바이트 센서 프레임 frame = 0x${fr.toString(16).toUpperCase()}u (${fr.toString(2).padStart(8,'0')})에서 ${askMode ? '모드 [7:5] ((frame >> 5u) & 0x07u)' : '채널 [4:0] (frame & 0x1Fu)'} 추출 결과는?`,
      options: opts,
      ans: 0,
      exp: `0x${fr.toString(16).toUpperCase()}는 2진수 ${fr.toString(2).padStart(8,'0')}이므로 상위 3비트 모드=${mode}, 하위 5비트 채널=${ch}입니다.`
    });
  });

  // MISRA-C & C Fundamentals review questions (15 items -> Total 105)

/* 02. MISRA-C.pdf p.21~22 실습 1 & 2: 안전한 32비트 마스크 만들기 */
static uint32_t make_mask(uint32_t bit)

    const uint32_t one = 1U;
    uint32_t mask = 0U;

    if (bit < 32U) {
        mask = one << bit;
    }
    return mask;
}

function saveState(showNotify = false) {
  try {
    const toSave = {
      currentView: appState.currentView,
      currentUnitId: appState.currentUnitId,
      completedUnits: appState.completedUnits,
      practiceHistory: appState.practiceHistory,
      wrongNotes: appState.wrongNotes,
      examHistory: appState.examHistory,
      project: appState.project,
      visualTab: appState.visualTab

    showToast('저장 공간 한도 초과 또는 브라우저 제한으로 저장에 실패했습니다.', 'error');
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const colors = {
    info: 'bg-slate-800 text-white border-slate-700',
    success: 'bg-emerald-700 text-white border-emerald-600',
    warning: 'bg-amber-600 text-white border-amber-500',
    error: 'bg-rose-700 text-white border-rose-600'
  };
  const icons = {
    info: 'fa-circle-info',
    success: 'fa-circle-check',
    warning: 'fa-triangle-exclamation',
    error: 'fa-circle-xmark'
  };
  const toast = document.createElement('div');
  toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-lg shadow-lg border text-xs font-medium ${colors[type] || colors.info} transition-all duration-300`;
  toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(8px)';
    setTimeout(() => toast.remove(), 300);
  }, 3200);
}

    appState.project.files.push({

  const lines = ta.value.split('\n').length;
  ln.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
}

function initLabEditorEvents() {
  const ta = document.getElementById('labCodeTextarea');
  if (!ta) return;
  updateLineNumbers();
  ta.addEventListener('input', () => {
    const file = getActiveLabFile();
    if (file) {
      file.content = ta.value;
      appState.unsaved = true;
      updateUnsavedIndicator();
      updateLineNumbers();
    }
  });
  ta.addEventListener('scroll', () => {
    const ln = document.getElementById('labLineNumbers');
    if (ln) ln.scrollTop = ta.scrollTop;
  });
  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveState(true);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = start + 4;
      ta.dispatchEvent(new Event('input'));
    }
  });
}

// --- Built-in Educational C11 Interpreter & Static Analyzer ---
function runLabCode(resetInputs = true) {
  const file = getActiveLabFile();
  if (!file) return;
  if (file.name.endsWith('.md')) {
    labRuntime.logs = [{ type: 'info', text: 'Markdown 문서 파일입니다. 실행하려면 .c 파일을 선택하세요.' }];
    labRuntime.waitingInput = false;
    renderAll();
    return;
  }

  if (resetInputs) {
    labRuntime.inputQueue = [];
    labRuntime.waitingInput = false;
  }

  const code = file.content;
  const logs = [];
  logs.push({ type: 'sys', text: `$ gcc -std=c11 -Wall -Wextra -pedantic ${file.name} -o app && ./app` });

  // Basic Static Checks (MISRA-C & Syntax hints)
  if (!code.includes('main')) {
    logs.push({ type: 'err', text: `ld: undefined reference to 'main'` });
    labRuntime.logs = logs;
    renderAll();
    return;
  }
  if (/a\[\w+\]\s*=\s*\w+\+\+/.test(code)) {
    logs.push({ type: 'warn', text: `[MISRA C Rule 13.2 경고] 평가 순서에 의존하는 부수 효과 수식(a[i] = i++)가 감지되었습니다.` });
  }
  if (/<<\s*(3[2-9]|[4-9]\d)/.test(code)) {
    logs.push({ type: 'warn', text: `[MISRA C Rule 12.2 경고] 32비트 폭 이상의 시프트 연산은 정의되지 않은 동작입니다.` });
  }

  try {
    const result = executeMiniC(code, [...labRuntime.inputQueue]);
    if (result.output) {
      logs.push({ type: 'out', text: result.output });
    }
    if (result.needInput) {
      labRuntime.waitingInput = true;
      labRuntime.pendingCode = code;
      logs.push({ type: 'sys', text: `[stdin 입력 대기] 위 안내에 맞춰 값을 입력하고 Enter를 누르세요...` });
    } else {
      labRuntime.waitingInput = false;
      logs.push({ type: 'sys', text: `\n[Program exited with code ${result.exitCode}]` });
    }
  } catch (err) {
    labRuntime.waitingInput = false;
    logs.push({ type: 'err', text: `[Compile / Runtime Error] ${err.message}` });
  }

  labRuntime.logs = logs;
  renderAll();
  setTimeout(() => {
    const inp = document.getElementById('terminalStdinInput');
    if (inp) inp.focus();
  }, 40);
}

function submitTerminalInput(e) {
  if (e) e.preventDefault();
  const inp = document.getElementById('terminalStdinInput');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  const tokens = val.split(/\s+/);
  labRuntime.inputQueue.push(...tokens);
  inp.value = '';
  runLabCode(false);
}

// Lightweight C11 execution engine supporting variables, structs/bit-fields, pointers, arrays, functions, loops, bitwise ops, printf/scanf
function executeMiniC(source, inputs) {
  let output = '';
  let inputIdx = 0;

  // Strip comments
  let clean = source
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .replace(/\/\/.*$/gm, '');

  // Handle #define macros (simple constant & function-like macros)
  const macros = {};
  clean = clean.replace(/^\s*#\s*define\s+([A-Za-z_]\w*)(?:\(([^)]*)\))?\s+(.+)$/gm, (_, name, params, body) => {
    macros[name] = { params: params ? params.split(',').map(s => s.trim()) : null, body: body.trim() };
    return '';
  });
  // Remove other preprocessor directives
  clean = clean.replace(/^\s*#.*$/gm, '');

  // Expand simple object macros
  Object.entries(macros).forEach(([name, m]) => {
    if (!m.params) {
      const re = new RegExp(`\\b${name}\\b`, 'g');
      clean = clean.replace(re, `(${m.body})`);
    }
  });

  // Extract typedef struct definitions
  const structDefs = {};
  clean = clean.replace(/typedef\s+struct\s*(?:[A-Za-z_]\w*)?\s*\{([\s\S]*?)\}\s*([A-Za-z_]\w*)\s*;/g, (_, body, typeName) => {
    const fields = [];
    body.split(';').forEach(line => {
      const l = line.trim();
      if (!l) return;
      const bfMatch = l.match(/([A-Za-z_]\w*)\s*:\s*(\d+)/);
      if (bfMatch) {
        fields.push({ name: bfMatch[1], bits: parseInt(bfMatch[2], 10) });
      } else {
        const parts = l.replace(/\[[^\]]*\]/, '').split(/\s+/);
        const fName = parts[parts.length - 1].replace('*', '');
        fields.push({ name: fName, bits: null });
      }
    });
    structDefs[typeName] = fields;
    return '';
  });

  // Extract functions
  const funcs = {};
  const fnRegex = /(?:static\s+)?(?:inline\s+)?(?:const\s+)?(?:unsigned\s+|signed\s+)?(?:void|int|short|long|char|float|double|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|size_t)\s+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*\{/g;
  let match;
  while ((match = fnRegex.exec(clean)) !== null) {
    const fnName = match[1];
    const paramStr = match[2].trim();
    const startBrace = match.index + match[0].length - 1;
    let depth = 1;
    let pos = startBrace + 1;
    while (pos < clean.length && depth > 0) {
      if (clean[pos] === '{') depth++;
      else if (clean[pos] === '}') depth--;
      pos++;
    }
    const body = clean.slice(startBrace + 1, pos - 1);
    const params = paramStr === 'void' || paramStr === ''
      ? []
      : paramStr.split(',').map(p => {
          const tokens = p.trim().replace(/\[[^\]]*\]/g, '').split(/\s+/);
          return tokens[tokens.length - 1].replace(/^\*+/, '');
        });
    funcs[fnName] = { params, body };
  }

  function splitArgs(argStr) {
    const res = [];
    let cur = '';
    let depth = 0;
    let inStr = false;
    for (let i = 0; i < argStr.length; i++) {
      const ch = argStr[i];
      if (ch === '"' && argStr[i - 1] !== '\\') inStr = !inStr;
      if (!inStr) {
        if (ch === '(' || ch === '[') depth++;
        else if (ch === ')' || ch === ']') depth--;
        else if (ch === ',' && depth === 0) {
          res.push(cur.trim());
          cur = '';
          continue;
        }
      }
      cur += ch;
    }
    if (cur.trim() !== '') res.push(cur.trim());
    return res;
  }

  function formatPrintf(fmt, args) {
    let argIdx = 0;
    let str = fmt.replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\\\/g, '\\');
    return str.replace(/%([0-9.*+-]*)(?:zu|lu|ld|lf|u|d|i|x|X|f|c|s|%)/g, (full, flags) => {
      if (full === '%%') return '%';
      const val = args[argIdx++];
      if (val === undefined) return '0';
      if (full.endsWith('s')) return String(val);
      if (full.endsWith('c')) return typeof val === 'number' ? String.fromCharCode(val) : String(val)[0] || '';
      if (full.endsWith('f')) {
        const precMatch = flags.match(/\.(\d+)/);
        const prec = precMatch ? parseInt(precMatch[1], 10) : 6;
        return Number(val).toFixed(prec);
      }
      if (full.endsWith('x') || full.endsWith('X')) {
        let hex = (Number(val) >>> 0).toString(16);
        if (full.endsWith('X')) hex = hex.toUpperCase();
        const padMatch = flags.match(/0(\d+)/);
        if (padMatch) hex = hex.padStart(parseInt(padMatch[1], 10), '0');
        return hex;
      }
      if (full.endsWith('u')) return String(Number(val) >>> 0);
      return String(Math.trunc(Number(val)));
    });
  }

  function evalExpr(expr, env) {
    let e = expr.trim();
    if (!e) return 0;
    if (e === 'NULL') return null;

    // Expand function-like macros
    Object.entries(macros).forEach(([name, m]) => {
      if (m.params) {
        const re = new RegExp(`\\b${name}\\s*\\(([^()]*)\\)`, 'g');
        e = e.replace(re, (_, argStr) => {
          const vals = splitArgs(argStr);
          let expanded = m.body;
          m.params.forEach((p, idx) => {
            expanded = expanded.replace(new RegExp(`\\b${p}\\b`, 'g'), `(${vals[idx] || 0})`);
          });
          return `(${expanded})`;
        });
      }
    });

    // Replace sizeof(...)
    e = e.replace(/sizeof\s*\(\s*([^)]+)\s*\)/g, (_, target) => {
      const t = target.trim();
      if (t === 'char' || t === 'uint8_t' || t === 'int8_t') return '1';
      if (t === 'short' || t === 'uint16_t' || t === 'int16_t') return '2';
      if (t === 'double' || t === 'long long' || t === 'uint64_t') return '8';
      if (env[t] && Array.isArray(env[t])) return String(env[t].length * 4);
      if (t.endsWith('[0]')) return '4';
      return '4';
    });

    // Replace C type casts like (uint32_t), (double), (unsigned), (int)
    e = e.replace(/\(\s*(?:const\s+)?(?:unsigned\s+|signed\s+)?(?:int|short|long|char|float|double|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|unsigned)\s*\*?\s*\)/g, '');

    // Remove integer literal suffixes like 1U, 0x07u, 100UL
    e = e.replace(/\b(0x[0-9a-fA-F]+|\d+)[uUlL]+\b/g, '$1');

    // Character literals 'A' -> 65
    e = e.replace(/'(\\?.)'/g, (_, ch) => {
      if (ch === '\\0') return '0';
      if (ch === '\\n') return '10';
      return String(ch.charCodeAt(0));
    });

    // Handle address-of &var
    if (/^&([A-Za-z_]\w*)$/.test(e)) {
      const vName = e.slice(1);
      return { __ptr: true, target: vName, envRef: env };
    }

    // Handle pointer dereference *ptr
    e = e.replace(/\*([A-Za-z_]\w*)/g, (full, pName) => {
      if (env[pName] && env[pName].__ptr) {
        return JSON.stringify(env[pName].envRef[env[pName].target]);
      }
      if (Array.isArray(env[pName])) {
        return JSON.stringify(env[pName][0]);
      }
      return full;
    });

    // Handle *(ptr + offset)
    e = e.replace(/\*\(\s*([A-Za-z_]\w*)\s*\+\s*([^)]+)\)/g, (_, pName, offExpr) => {
      const off = evalExpr(offExpr, env);
      if (Array.isArray(env[pName])) return JSON.stringify(env[pName][off] ?? 0);
      return '0';
    });

    // Handle struct member access obj.field or ptr->field
    e = e.replace(/([A-Za-z_]\w*)\s*->\s*([A-Za-z_]\w*)/g, (_, pName, field) => {
      const ptr = env[pName];
      const obj = ptr && ptr.__ptr ? ptr.envRef[ptr.target] : ptr;
      return obj && obj[field] !== undefined ? JSON.stringify(obj[field]) : '0';
    });
    e = e.replace(/([A-Za-z_]\w*)\.([A-Za-z_]\w*)/g, (_, oName, field) => {
      const obj = env[oName];
      return obj && obj[field] !== undefined ? JSON.stringify(obj[field]) : '0';
    });

    // Handle function calls defined in source
    e = e.replace(/\b([A-Za-z_]\w*)\s*\(([^()]*)\)/g, (full, fn, argStr) => {
      if (fn === 'Number' || fn === 'Math') return full;
      if (funcs[fn]) {
        const argVals = argStr.trim() ? splitArgs(argStr).map(a => evalExpr(a, env)) : [];
        const callRes = callFunc(fn, argVals);
        return JSON.stringify(callRes ? callRes.value : 0);
      }
      if (fn === 'strlen') {
        const s = evalExpr(argStr, env);
        return String(String(s).length);
      }
      return full;
    });

    // Handle array indexing arr[idx]
    e = e.replace(/([A-Za-z_]\w*)\[([^\]]+)\]/g, (_, arrName, idxExpr) => {
      const idx = evalExpr(idxExpr, env);
      if (Array.isArray(env[arrName])) return JSON.stringify(env[arrName][idx] ?? 0);
      return '0';
    });

    // Replace variables with values from env
    e = e.replace(/\b([A-Za-z_]\w*)\b/g, (word) => {
      if (word === 'true') return '1';
      if (word === 'false') return '0';
      if (word === 'null') return 'null';
      if (Object.prototype.hasOwnProperty.call(env, word)) {
        const v = env[word];
        if (typeof v === 'string') return JSON.stringify(v);
        if (typeof v === 'number' || typeof v === 'boolean' || v === null) return String(v);
      }
      return word;
    });

    try {
      const fn = new Function(`return (${e});`);
      const val = fn();
      if (typeof val === 'boolean') return val ? 1 : 0;
      return val;
    } catch {
      return 0;
    }
  }

  function applyBitFieldMask(obj, field, val) {
    if (obj && obj.__bitfields && obj.__bitfields[field]) {
      const bits = obj.__bitfields[field];
      const mask = (1 << bits) - 1;
      obj[field] = Number(val) & mask;
    } else if (obj) {
      obj[field] = val;
    }
  }

  function execBlock(stmts, env) {
    let steps = 0;
    for (let i = 0; i < stmts.length; i++) {
      if (++steps > 5000) throw new Error('무한 루프가 감지되어 실행을 중단했습니다.');
      const stmt = stmts[i].trim();
      if (!stmt || stmt === ';') continue;

      // return statement
      if (stmt.startsWith('return')) {
        const expr = stmt.slice(6).replace(/;$/, '').trim();
        return { returned: true, value: expr ? evalExpr(expr, env) : 0 };
      }

      // printf(...)
      if (stmt.startsWith('printf(')) {
        const inner = stmt.slice(7, stmt.lastIndexOf(')'));
        const args = splitArgs(inner);
        const fmt = args[0].replace(/^"|"$/g, '');
        const vals = args.slice(1).map(a => evalExpr(a, env));
        output += formatPrintf(fmt, vals);
        continue;
      }

      // puts(...)
      if (stmt.startsWith('puts(')) {
        const inner = stmt.slice(5, stmt.lastIndexOf(')')).trim().replace(/^"|"$/g, '');
        output += inner + '\n';
        continue;
      }

      // scanf(...)
      if (stmt.startsWith('scanf(')) {
        const inner = stmt.slice(6, stmt.lastIndexOf(')'));
        const args = splitArgs(inner);
        const targets = args.slice(1);
        for (const t of targets) {
          if (inputIdx >= inputs.length) {
            return { needInput: true };
          }
          const rawIn = inputs[inputIdx++];
          const vName = t.replace(/^&/, '').trim();
          const numVal = Number(rawIn);
          env[vName] = isNaN(numVal) ? rawIn : numVal;
        }
        continue;
      }

      // strcat(dst, src)
      if (stmt.startsWith('strcat(')) {
        const args = splitArgs(stmt.slice(7, stmt.lastIndexOf(')')));
        const dst = args[0];
        const src = args[1].replace(/^"|"$/g, '');
        if (typeof env[dst] === 'string') env[dst] += src;
        continue;
      }

      // Struct variable declaration: StructType var = { ... };
      const structDecl = stmt.match(/^([A-Za-z_]\w*)\s+([A-Za-z_]\w*)\s*=\s*\{([^}]*)\}\s*;$/);
      if (structDecl && structDefs[structDecl[1]]) {
        const fields = structDefs[structDecl[1]];
        const vals = splitArgs(structDecl[3]).map(v => evalExpr(v, env));
        const obj = { __bitfields: {} };
        fields.forEach((f, idx) => {
          if (f.bits) obj.__bitfields[f.name] = f.bits;
          applyBitFieldMask(obj, f.name, vals[idx] !== undefined ? vals[idx] : 0);
        });
        env[structDecl[2]] = obj;
        continue;
      }

      // Array declaration: int arr[] = { 1, 2, 3 };
      const arrDecl = stmt.match(/^(?:const\s+)?(?:unsigned\s+)?(?:int|short|long|char|double|float)\s+([A-Za-z_]\w*)\s*\[[^\]]*\]\s*=\s*\{([^}]*)\}\s*;$/);
      if (arrDecl) {
        env[arrDecl[1]] = splitArgs(arrDecl[2]).map(v => evalExpr(v, env));
        continue;
      }

      // String char array declaration: char msg[32] = "HYUNDAI";
      const strDecl = stmt.match(/^char\s+([A-Za-z_]\w*)\s*\[[^\]]*\]\s*=\s*"([^"]*)"\s*;$/);
      if (strDecl) {
        env[strDecl[1]] = strDecl[2];
        continue;
      }

      // Standard variable declaration(s): int x = 0, y = 1;
      const varDecl = stmt.match(/^(?:static\s+)?(?:const\s+)?(?:unsigned\s+|signed\s+)?(?:int|short|long|char|float|double|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|size_t)\s+(.+);$/);
      if (varDecl) {
        const declParts = splitArgs(varDecl[1]);
        declParts.forEach(part => {
          const p = part.replace(/^\*+/, '').trim();
          const eqIdx = p.indexOf('=');
          if (eqIdx >= 0) {
            const name = p.slice(0, eqIdx).trim();
            const valExpr = p.slice(eqIdx + 1).trim();
            env[name] = evalExpr(valExpr, env);
          } else {
            env[p] = 0;
          }
        });
        continue;
      }

      // if / else statement
      if (stmt.startsWith('if')) {
        const condEnd = findMatchingParen(stmt, stmt.indexOf('('));
        const condExpr = stmt.slice(stmt.indexOf('(') + 1, condEnd);
        const rest = stmt.slice(condEnd + 1).trim();
        let thenBody = '';
        let elseBody = '';
        if (rest.startsWith('{')) {
          const blockEnd = findMatchingBrace(rest, 0);
          thenBody = rest.slice(1, blockEnd);
          const afterThen = rest.slice(blockEnd + 1).trim();
          if (afterThen.startsWith('else')) {
            const eb = afterThen.slice(4).trim();
            elseBody = eb.startsWith('{') ? eb.slice(1, findMatchingBrace(eb, 0)) : eb;
          }
        } else {
          thenBody = rest;
        }
        if (evalExpr(condExpr, env)) {
          const r = execBlock(parseStatements(thenBody), env);
          if (r && (r.returned || r.needInput)) return r;
        } else if (elseBody) {
          const r = execBlock(parseStatements(elseBody), env);
          if (r && (r.returned || r.needInput)) return r;
        }
        continue;
      }

      // while loop
      if (stmt.startsWith('while')) {
        const condEnd = findMatchingParen(stmt, stmt.indexOf('('));
        const condExpr = stmt.slice(stmt.indexOf('(') + 1, condEnd);
        const rest = stmt.slice(condEnd + 1).trim();
        const body = rest.startsWith('{') ? rest.slice(1, findMatchingBrace(rest, 0)) : rest;
        const bodyStmts = parseStatements(body);
        let guard = 0;
        while (evalExpr(condExpr, env)) {
          if (++guard > 2000) throw new Error('while 루프 반복 한도를 초과했습니다.');
          const r = execBlock(bodyStmts, env);
          if (r && (r.returned || r.needInput)) return r;
        }
        continue;
      }

      // for loop
      if (stmt.startsWith('for')) {
        const headerEnd = findMatchingParen(stmt, stmt.indexOf('('));
        const header = stmt.slice(stmt.indexOf('(') + 1, headerEnd);
        const [initS, condS, stepS] = header.split(';');
        const rest = stmt.slice(headerEnd + 1).trim();
        const body = rest.startsWith('{') ? rest.slice(1, findMatchingBrace(rest, 0)) : rest;
        const bodyStmts = parseStatements(body);
        if (initS && initS.trim()) execBlock([initS.trim() + ';'], env);
        let guard = 0;
        while (!condS || !condS.trim() || evalExpr(condS, env)) {
          if (++guard > 2000) throw new Error('for 루프 반복 한도를 초과했습니다.');
          const r = execBlock(bodyStmts, env);
          if (r && (r.returned || r.needInput)) return r;
          if (stepS && stepS.trim()) execBlock([stepS.trim() + ';'], env);
        }
        continue;
      }

      // Struct field assignment / compound assignment: s.retries++ or p->voltage += offset or cfg->mode = mode
      const fieldInc = stmt.match(/^([A-Za-z_]\w*)(?:\.|->)([A-Za-z_]\w*)\s*(\+\+|--)\s*;$/);
      if (fieldInc) {
        const ptr = env[fieldInc[1]];
        const obj = ptr && ptr.__ptr ? ptr.envRef[ptr.target] : ptr;
        if (obj) {
          const cur = Number(obj[fieldInc[2]] || 0);
          applyBitFieldMask(obj, fieldInc[2], fieldInc[3] === '++' ? cur + 1 : cur - 1);
        }
        continue;
      }

      const fieldAssign = stmt.match(/^([A-Za-z_]\w*)(?:\.|->)([A-Za-z_]\w*)\s*(\+=|-=|\|=|&=|\^=|=)\s*(.+);$/);
      if (fieldAssign) {
        const ptr = env[fieldAssign[1]];
        const obj = ptr && ptr.__ptr ? ptr.envRef[ptr.target] : ptr;
        if (obj) {
          const cur = Number(obj[fieldAssign[2]] || 0);
          const rhs = evalExpr(fieldAssign[4], env);
          let next = rhs;
          if (fieldAssign[3] === '+=') next = cur + rhs;
          else if (fieldAssign[3] === '-=') next = cur - rhs;
          else if (fieldAssign[3] === '|=') next = cur | rhs;
          else if (fieldAssign[3] === '&=') next = cur & rhs;
          else if (fieldAssign[3] === '^=') next = cur ^ rhs;
          applyBitFieldMask(obj, fieldAssign[2], next);
        }
        continue;
      }

      // Pointer dereference assignment: *px = tmp;
      const ptrAssign = stmt.match(/^\*([A-Za-z_]\w*)\s*=\s*(.+);$/);
      if (ptrAssign) {
        const ptr = env[ptrAssign[1]];
        const val = evalExpr(ptrAssign[2], env);
        if (ptr && ptr.__ptr) {
          ptr.envRef[ptr.target] = val;
        }
        continue;
      }

      // Variable increment / decrement: x++; ++x;
      const incMatch = stmt.match(/^(?:(\+\+|--)\s*([A-Za-z_]\w*)|([A-Za-z_]\w*)\s*(\+\+|--))\s*;$/);
      if (incMatch) {
        const vName = incMatch[2] || incMatch[3];
        const op = incMatch[1] || incMatch[4];
        env[vName] = Number(env[vName] || 0) + (op === '++' ? 1 : -1);
        continue;
      }

      // Standard or compound variable assignment: x = a + b; permissions |= write_bit;
      const assignMatch = stmt.match(/^([A-Za-z_]\w*)\s*(\+=|-=|\*=|\/=|%=|\|=|&=|\^=|<<=|>>=|=)\s*(.+);$/);
      if (assignMatch) {
        const vName = assignMatch[1];
        const op = assignMatch[2];
        const rhs = evalExpr(assignMatch[3], env);
        const cur = Number(env[vName] || 0);
        if (op === '=') env[vName] = rhs;
        else if (op === '+=') env[vName] = cur + rhs;
        else if (op === '-=') env[vName] = cur - rhs;
        else if (op === '*=') env[vName] = cur * rhs;
        else if (op === '/=') env[vName] = Math.trunc(cur / rhs);
        else if (op === '%=') env[vName] = cur % rhs;
        else if (op === '|=') env[vName] = cur | rhs;
        else if (op === '&=') env[vName] = cur & rhs;
        else if (op === '^=') env[vName] = cur ^ rhs;
        else if (op === '<<=') env[vName] = cur << rhs;
        else if (op === '>>=') env[vName] = cur >> rhs;
        continue;
      }

      // Standalone function call: swap(&a, &b);
      const callMatch = stmt.match(/^([A-Za-z_]\w*)\s*\((.*)\)\s*;$/);
      if (callMatch && funcs[callMatch[1]]) {
        const argVals = callMatch[2].trim() ? splitArgs(callMatch[2]).map(a => evalExpr(a, env)) : [];
        const r = callFunc(callMatch[1], argVals);
        if (r && r.needInput) return r;
      }
    }
    return { returned: false, value: 0 };
  }

  function callFunc(fnName, argVals) {
    const fn = funcs[fnName];
    if (!fn) return { returned: true, value: 0 };
    const env = {};
    fn.params.forEach((p, idx) => {
      env[p] = argVals[idx] !== undefined ? argVals[idx] : 0;
    });

    const stmts = parseStatements(fn.body);
    const res = execBlock(stmts, env);
    if (res && res.needInput) return { needInput: true };
    return { returned: true, value: res && res.returned ? res.value : 0 };
  }

  function findMatchingParen(str, openIdx) {
    let depth = 0;
    for (let i = openIdx; i < str.length; i++) {
      if (str[i] === '(') depth++;
      else if (str[i] === ')') {
        depth--;
        if (depth === 0) return i;
      }
    }
    return str.length - 1;
  }

  function findMatchingBrace(str, openIdx) {
    let depth = 0;
    for (let i = openIdx; i < str.length; i++) {
      if (str[i] === '{') depth++;
      else if (str[i] === '}') {
        depth--;
        if (depth === 0) return i;
      }
    }
    return str.length - 1;
  }

  function parseStatements(codeBlock) {
    const list = [];
    let cur = '';
    let braceDepth = 0;
    let parenDepth = 0;
    let inStr = false;
    for (let i = 0; i < codeBlock.length; i++) {
      const ch = codeBlock[i];
      if (ch === '"' && codeBlock[i - 1] !== '\\') inStr = !inStr;
      cur += ch;
      if (!inStr) {
        if (ch === '(') parenDepth++;
        else if (ch === ')') parenDepth--;
        else if (ch === '{') braceDepth++;
        else if (ch === '}') {
          braceDepth--;
          if (braceDepth === 0 && parenDepth === 0) {
            const restTrim = codeBlock.slice(i + 1).trimStart();
            if (restTrim.startsWith('else')) continue;
            list.push(cur.trim());
            cur = '';
          }
        } else if (ch === ';' && braceDepth === 0 && parenDepth === 0) {
          list.push(cur.trim());
          cur = '';
        }
      }
    }
    if (cur.trim()) list.push(cur.trim());
    return list;
  }

  const mainRes = callFunc('main', []);
  if (mainRes && mainRes.needInput) {
    return { output, needInput: true, exitCode: 0 };
  }
  return { output, needInput: false, exitCode: mainRes ? mainRes.value : 0 };
}

function renderBitBoxes(byteVal, label, interactiveTarget = null, highlightMask = 0) {
  const bits = Array.from({ length: 8 }, (_, i) => 7 - i);
  return `
    <div class="space-y-1.5">
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-700">${label}</span>
        <span class="font-mono text-slate-600">0x${(byteVal & 0xFF).toString(16).toUpperCase().padStart(2, '0')} (${byteVal & 0xFF})</span>
      </div>
      <div class="grid grid-cols-8 gap-1.5">
        ${bits.map(b => {
          const isOne = ((byteVal >> b) & 1) === 1;
          const isHigh = ((highlightMask >> b) & 1) === 1;
          return `
            <button ${interactiveTarget ? `onclick="toggleVisBit('${interactiveTarget}', ${b})"` : 'disabled'}
              class="bit-box p-2 rounded-lg border text-center font-mono ${isOne ? 'bg-[#002C5F] text-white border-[#002C5F] bit-box-active' : 'bg-slate-50 text-slate-600 border-slate-200'} ${isHigh ? 'ring-2 ring-amber-400' : ''}">
              <div class="text-[9px] opacity-70">b${b}</div>
              <div class="text-sm font-extrabold">${isOne ? 1 : 0}</div>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function toggleVisBit(target, bitPos) {
  visState[target] = (visState[target] ^ (1 << bitPos)) & 0xFF;
  renderAll();
}

function renderBitwiseVisual() {
  const a = visState.bitA & 0xFF;
  const b = visState.bitB & 0xFF;
  let res = 0;
  if (visState.bitOp === '&') res = a & b;
  else if (visState.bitOp === '|') res = a | b;
  else if (visState.bitOp === '^') res = a ^ b;
  else if (visState.bitOp === '~') res = (~a) & 0xFF;
  else if (visState.bitOp === '<<') res = (a << visState.shiftAmt) & 0xFF;
  else if (visState.bitOp === '>>') res = (a >> visState.shiftAmt) & 0xFF;

  const mask = (1 << visState.maskBitPos) & 0xFF;

  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 8-bit Bitwise Calculator -->
      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">

        ${renderBitBoxes(a, '피연산자 A (클릭하여 비트 변경)', 'bitA')}
        <div class="flex flex-wrap items-center gap-2 py-1">
          ${['&', '|', '^', '~', '<<', '>>'].map(op => `
            <button onclick="visState.bitOp='${op}'; renderAll();" class="px-3.5 py-1.5 rounded-lg font-mono text-xs font-extrabold ${visState.bitOp === op ? 'bg-[#007FA8] text-white' : 'bg-slate-100 text-slate-700'}">
              ${op}
            </button>
          `).join('')}
          ${(visState.bitOp === '<<' || visState.bitOp === '>>') ? `
            <label class="text-xs font-bold text-slate-600 ml-2">시프트 칸수(0~7):
              <input type="number" min="0" max="7" value="${visState.shiftAmt}" onchange="visState.shiftAmt=Math.max(0,Math.min(7,Number(this.value))); renderAll();" class="w-14 border border-slate-300 rounded px-2 py-1 ml-1 font-mono" />
            </label>
          ` : ''}
        </div>
        ${(visState.bitOp === '&' || visState.bitOp === '|' || visState.bitOp === '^') ? renderBitBoxes(b, '피연산자 B (클릭하여 비트 변경)', 'bitB') : ''}
        <div class="pt-2 border-t border-slate-200">
          ${renderBitBoxes(res, `연산 결과 (A ${visState.bitOp} ${['~','<<','>>'].includes(visState.bitOp) ? (visState.bitOp==='~'?'':visState.shiftAmt) : 'B'})`)}
        </div>
      </div>

      <!-- 4-Core Bit Mask Operations -->
      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
        <h2 class="text-base font-extrabold text-[#002C5F]">비트 마스크 4대 핵심 조작기 (교재 p.7~8)</h2>

          <span class="font-bold text-slate-700">대상 비트 위치 (k):</span>
          <select onchange="visState.maskBitPos=Number(this.value); renderAll();" class="border border-slate-300 rounded-lg px-3 py-1.5 font-mono font-bold">

          </button>

  const bytes = [
    (visState.sampleInt) & 0xFF,
    (visState.sampleInt >> 8) & 0xFF,
    (visState.sampleInt >> 16) & 0xFF,
    (visState.sampleInt >> 24) & 0xFF
  ];
  const arrVals = [10, 20, 30, 40, 50];
  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
        <h2 class="text-base font-extrabold text-[#002C5F]">32비트 정수 리틀 엔디안(Little-Endian) 바이트 배치</h2>
        <div class="flex items-center gap-2 text-xs">
          <span class="font-bold">32비트 정수 값:</span>
          <input type="number" value="${visState.sampleInt}" onchange="visState.sampleInt=Number(this.value); renderAll();" class="border border-slate-300 rounded-lg px-3 py-1.5 font-mono" />
          <span class="font-mono text-slate-500">(0x${(visState.sampleInt >>> 0).toString(16).toUpperCase().padStart(8,'0')})</span>
        </div>
        <div class="grid grid-cols-4 gap-2 pt-2">
          ${bytes.map((b, i) => `
            <div class="p-3 rounded-xl border border-blue-200 bg-blue-50/60 text-center font-mono">
              <div class="text-[10px] text-slate-500">0x100${i} (LSB+${i})</div>
              <div class="text-base font-extrabold text-[#002C5F] mt-1">0x${b.toString(16).toUpperCase().padStart(2,'0')}</div>
              <div class="text-[10px] text-slate-600 mt-0.5">${b.toString(2).padStart(8,'0')}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
        <h2 class="text-base font-extrabold text-[#002C5F]">배열과 포인터 산술 연산 (*(p + i) == arr[i])</h2>
        <div class="flex items-center gap-2 text-xs">
          <span class="font-bold">포인터 오프셋 i 선택:</span>
          ${[0,1,2,3,4].map(i => `
            <button onclick="visState.arrIndex=${i}; renderAll();" class="px-3 py-1 rounded-lg font-mono font-bold ${visState.arrIndex===i ? 'bg-[#007FA8] text-white' : 'bg-slate-100 text-slate-700'}">
              p + ${i}
            </button>
          `).join('')}
        </div>
        <div class="grid grid-cols-5 gap-2 pt-2">
          ${arrVals.map((v, i) => `
            <div class="p-3 rounded-xl border text-center font-mono ${visState.arrIndex===i ? 'border-sky-500 bg-sky-50 ring-2 ring-sky-300' : 'border-slate-200 bg-slate-50'}">
              <div class="text-[10px] text-slate-500">0x200${i * 4}</div>
              <div class="text-sm font-extrabold text-slate-900 my-1">${v}</div>
              <div class="text-[10px] font-bold text-[#007FA8]">arr[${i}]</div>
            </div>
          `).join('')}
        </div>
        <div class="p-3 rounded-lg bg-slate-900 text-emerald-300 font-mono text-xs">
          주소 계산: 0x2000 + (${visState.arrIndex} * sizeof(int)[4B]) = 0x${(0x2000 + visState.arrIndex * 4).toString(16).toUpperCase()} → 역참조 값 *(p + ${visState.arrIndex}) = ${arrVals[visState.arrIndex]}
        </div>
      </div>
    </div>
  `;
}

let practiceAnswers = {}; // qId -> selected option index

function selectPracticeOption(qId, optIdx) {
  const q = QUESTION_BANK.find(x => x.id === qId);
  if (!q) return;
  practiceAnswers[qId] = optIdx;
  const isCorrect = optIdx === q.ans;

  appState.practiceHistory.push({
    qId: q.id,
    unitId: q.unitId,
    correct: isCorrect,
    selected: optIdx,
    timestamp: Date.now()
  });

  if (!isCorrect && !appState.wrongNotes.includes(q.id)) {
    appState.wrongNotes.push(q.id);
  } else if (isCorrect) {
    appState.wrongNotes = appState.wrongNotes.filter(id => id !== q.id);
  }

  saveState(false);
  renderAll();
}

let examSession = {
  active: false,
  mode: 'mock', // 'mock' | 'wrong'
  questions: [],
  answers: {},
  submitted: false,
  remainingSec: 900,
  timerId: null
};

function startExamSession(mode = 'mock') {
  if (examSession.timerId) clearInterval(examSession.timerId);
  let pool = [];
  if (mode === 'wrong') {
    pool = QUESTION_BANK.filter(q => appState.wrongNotes.includes(q.id));
    if (pool.length === 0) {
      showToast('현재 오답 노트에 등록된 문항이 없습니다!', 'info');
      return;
    }
  } else {
    pool = [...QUESTION_BANK].sort(() => Math.random() - 0.5).slice(0, 15);
  }

  examSession = {
    active: true,
    mode,
    questions: pool,
    answers: {},
    submitted: false,
    remainingSec: pool.length * 60,
    timerId: setInterval(() => {
      if (!examSession.active || examSession.submitted) return;
      examSession.remainingSec--;
      const timerEl = document.getElementById('examTimerDisplay');
      if (timerEl) {
        const m = String(Math.floor(examSession.remainingSec / 60)).padStart(2, '0');
        const s = String(examSession.remainingSec % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }
      if (examSession.remainingSec <= 0) {
        submitExamSession();
      }
    }, 1000)
  };
  renderAll();
}

function submitExamSession() {
  if (examSession.submitted) return;
  if (examSession.timerId) clearInterval(examSession.timerId);
  examSession.submitted = true;

  let correctCount = 0;
  const weakMap = {};
  examSession.questions.forEach(q => {
    const picked = examSession.answers[q.id];
    if (picked === q.ans) {
      correctCount++;
      appState.wrongNotes = appState.wrongNotes.filter(id => id !== q.id);
    } else {
      if (!appState.wrongNotes.includes(q.id)) appState.wrongNotes.push(q.id);
      const u = THEORY_UNITS.find(x => x.id === q.unitId);
      const label = u ? u.chapter : q.unitId;
      weakMap[label] = (weakMap[label] || 0) + 1;
    }
  });

  const total = examSession.questions.length;
  const rate = Math.round((correctCount / total) * 100);
  const weakUnits = Object.entries(weakMap).sort((a, b) => b[1] - a[1]).map(x => x[0]);

  if (examSession.mode === 'mock') {
    appState.examHistory.unshift({
      date: new Date().toLocaleDateString('ko-KR'),
      score: correctCount,
      total,
      rate,
      weakUnits
    });
  }
  saveState(true);
  renderAll();
}

  const totalUnits = THEORY_UNITS.length;

  const totalAttempts = appState.practiceHistory.length;

// ----------------------------------------------------------------------------
// 13. HELPERS & MASTER RENDER
// ----------------------------------------------------------------------------
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function copyTextToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('코드가 클립보드에 복사되었습니다.', 'success');
  }).catch(() => {
    showToast('복사에 실패했습니다.', 'error');
  });
}

function renderAll() {
  renderSidebarAndHeader();
  const main = document.getElementById('mainContentArea');
  switch (appState.currentView) {
    case 'theory':
      main.innerHTML = renderTheoryView();
      break;
    case 'lab':
      main.innerHTML = renderLabView();
      initLabEditorEvents();
      break;
    case 'visual':
      main.innerHTML = renderVisualizationView();
      break;
    case 'practice':
      main.innerHTML = renderPracticeView();
      break;
    case 'exam':
      main.innerHTML = renderExamView();
      break;
    case 'dashboard':
      main.innerHTML = renderDashboardView();
      break;
    default:
      main.innerHTML = renderTheoryView();
  }
}

// Initialize on load
window.addEventListener('DOMContentLoaded', () => {
  loadState();
  renderAll();
});
