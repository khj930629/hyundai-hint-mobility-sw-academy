<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모빌리티 SW 개론 및 프로세스 | Mobility SW Academy</title>
  <style>
    :root {
      --navy: #002C5F;
      --navy-dark: #001D40;
      --navy-light: #0A3D7A;
      --blue: #007FA8;
      --blue-light: #E6F4F9;
      --blue-hover: #006688;
      --slate: #F4F6F9;
      --slate-border: #DCE2EA;
      --white: #FFFFFF;
      --text-main: #1A2433;
      --text-sub: #4A5568;
      --text-muted: #718096;
      --success: #0F766E;
      --success-bg: #CCFBF1;
      --warning: #B45309;
      --warning-bg: #FEF3C7;
      --danger: #B91C1C;
      --danger-bg: #FEE2E2;
      --shadow-sm: 0 1px 3px rgba(0,44,95,0.08);
      --shadow-md: 0 4px 12px rgba(0,44,95,0.1);
      --radius: 10px;
      --sidebar-w: 290px;
      --header-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
      background-color: var(--slate);
      color: var(--text-main);
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout */
    .app-shell { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--navy);
      color: var(--white);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      overflow-y: auto;
    }
    .sidebar-brand {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: var(--navy-dark);
    }
    .brand-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--blue);
      color: var(--white);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .brand-title { font-size: 16px; font-weight: 700; line-height: 1.35; }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,0.68); margin-top: 2px; }

    .nav-section { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .nav-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 10px 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.85);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: var(--white); }
    .nav-item.active { background: var(--blue); color: var(--white); font-weight: 600; }

    .track-group { margin-bottom: 6px; }
    .track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      background: rgba(255,255,255,0.05);
      border: none;
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
    }
    .track-header:hover { background: rgba(255,255,255,0.12); }
    .unit-list { padding: 4px 0 4px 10px; display: none; }
    .unit-list.open { display: block; }
    .unit-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font-size: 12.5px;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1.35;
    }
    .unit-btn:hover { color: var(--white); background: rgba(255,255,255,0.08); }
    .unit-btn.active { color: var(--white); background: var(--blue); font-weight: 600; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.45);
      flex-shrink: 0;
    }
    .status-dot.done { background: #2DD4BF; border-color: #2DD4BF; }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 18px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      background: var(--navy-dark);
      line-height: 1.45;
    }

    /* Main Content Area */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Sticky Top Header */
    .top-header {
      height: var(--header-h);
      background: var(--white);
      border-bottom: 1px solid var(--slate-border);
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mobile-menu-btn {
      display: none;
      background: var(--slate);
      border: 1px solid var(--slate-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 16px;
      cursor: pointer;
      color: var(--navy);
    }
    .breadcrumb {
      font-size: 13px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .breadcrumb strong { color: var(--navy); font-weight: 700; }

    .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .progress-widget { display: flex; align-items: center; gap: 10px; }
    .progress-label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
    .progress-bar-bg {
      width: 110px; height: 8px;
      background: var(--slate-border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--navy), var(--blue));
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-pct { font-size: 12.5px; font-weight: 700; color: var(--navy); min-width: 36px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-blue { background: var(--blue); color: var(--white); }
    .btn-blue:hover { background: var(--blue-hover); }
    .btn-outline { background: var(--white); border-color: var(--slate-border); color: var(--text-main); }
    .btn-outline:hover { background: var(--slate); border-color: #CBD5E1; }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* Container */
    .content-container {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 28px 64px;
    }

    /* Cards & Common UI */
    .card {
      background: var(--white);
      border: 1px solid var(--slate-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .hero-banner {
      background: linear-gradient(135deg, var(--navy) 0%, #004282 65%, var(--blue) 100%);
      color: var(--white);
      border-radius: 12px;
      padding: 36px 36px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
    }
    .hero-tag {
      display: inline-block;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .hero-banner h1 { font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
    .hero-banner p { font-size: 15px; color: rgba(255,255,255,0.9); max-width: 780px; margin-bottom: 22px; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .badge-std { background: #E0F2FE; color: #0369A1; border: 1px solid #BAE6FD; }
    .badge-sup { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
    .badge-track { background: var(--navy); color: var(--white); }

    /* Quick Section Jump Bar */
    .quick-jump-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--slate-border);
    }
    .jump-chip {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--slate);
      color: var(--text-sub);
      border: 1px solid var(--slate-border);
      cursor: pointer;
      transition: all 0.12s;
    }
    .jump-chip:hover {
      background: var(--blue-light);
      color: var(--navy);
      border-color: var(--blue);
    }

    /* Lesson 8-Section Styling */
    .lesson-header-card {
      background: var(--white);
      border-left: 5px solid var(--navy);
      border-top: 1px solid var(--slate-border);
      border-right: 1px solid var(--slate-border);
      border-bottom: 1px solid var(--slate-border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 22px;
    }
    .lesson-title { font-size: 24px; font-weight: 800; color: var(--navy); margin: 8px 0 6px; }
    .lesson-eng { font-size: 13.5px; color: var(--blue); font-weight: 600; }

    .sec-card {
      background: var(--white);
      border: 1px solid var(--slate-border);
      border-radius: var(--radius);
      padding: 26px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--slate);
    }
    .sec-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: 0.04em;
      display: block;
    }
    .sec-title { font-size: 18px; font-weight: 700; color: var(--navy); }
    .theory-block p { margin-bottom: 12px; font-size: 15px; color: var(--text-main); }
    .theory-block p:last-child { margin-bottom: 0; }
    .intuition-box {
      background: var(--blue-light);
      border-left: 4px solid var(--blue);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
    }
    .intuition-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }

    .styled-list { padding-left: 20px; margin: 10px 0; }
    .styled-list li { margin-bottom: 8px; font-size: 14.5px; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 14px 0; }
    table.comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 560px;
    }
    .comp-table th {
      background: var(--navy);
      color: var(--white);
      text-align: left;
      padding: 11px 14px;
      font-weight: 600;
    }
    .comp-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--slate-border);
      vertical-align: top;
    }
    .comp-table tr:nth-child(even) td { background: #F9FBFD; }

    /* SVG Container */
    .diagram-box {
      background: #FAFBFD;
      border: 1px solid var(--slate-border);
      border-radius: 8px;
      padding: 16px;
      margin: 14px 0;
      text-align: center;
      overflow-x: auto;
    }
    .diagram-caption { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; font-weight: 600; }

    /* Pros & Cons */
    .pros-cons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    .pc-box { border-radius: 8px; padding: 16px; border: 1px solid var(--slate-border); }
    .pc-box.pros { background: #F0FDF9; border-color: #99F6E4; }
    .pc-box.cons { background: #FFFBEB; border-color: #FDE68A; }
    .pc-box h4 { font-size: 14px; margin-bottom: 8px; color: var(--navy); }

    /* Interactive Tabs & Simulators */
    .tab-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--slate-border);
      padding-bottom: 12px;
    }
    .tab-btn {
      padding: 9px 16px;
      border-radius: 7px;
      border: 1px solid var(--slate-border);
      background: var(--white);
      color: var(--text-sub);
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

    .sim-node-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .sim-node {
      flex: 1;
      min-width: 130px;
      padding: 14px 12px;
      background: var(--white);
      border: 2px solid var(--slate-border);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sim-node:hover { border-color: var(--blue); }
    .sim-node.selected { border-color: var(--navy); background: var(--blue-light); }
    .sim-detail-panel {
      background: var(--slate);
      border: 1px solid var(--slate-border);
      border-radius: 8px;
      padding: 20px;
      margin-top: 14px;
    }

    /* Quiz Styling */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1.5px solid var(--slate-border);
      border-radius: 8px;
      background: var(--white);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .quiz-option:hover { border-color: var(--blue); background: #F8FAFC; }
    .quiz-option.selected { border-color: var(--navy); background: var(--blue-light); font-weight: 600; }
    .quiz-option.correct { border-color: var(--success); background: var(--success-bg); color: #064E3B; }
    .quiz-option.wrong { border-color: var(--danger); background: var(--danger-bg); color: #7F1D1D; }

    /* Memo Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,29,64,0.45);
      z-index: 190;
      display: none;
    }
    .drawer-backdrop.open { display: block; }
    .memo-drawer {
      position: fixed;
      top: 0; right: -420px; bottom: 0;
      width: 400px; max-width: 92vw;
      background: var(--white);
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
    }
    .memo-drawer.open { right: 0; }
    .drawer-header {
      padding: 18px 20px;
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-body { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .memo-textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border: 1px solid var(--slate-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
    }

    /* Search & Filter */
    .input-control {
      padding: 9px 14px;
      border: 1px solid var(--slate-border);
      border-radius: 7px;
      font-size: 14px;
      background: var(--white);
    }

    /* Responsive */
    @media (max-width: 960px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrapper { margin-left: 0; }
      .mobile-menu-btn { display: inline-block; }
      .grid-3, .grid-2, .pros-cons-grid { grid-template-columns: 1fr; }
      .top-header { padding: 0 16px; }
      .content-container { padding: 18px 16px 48px; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- Left Fixed Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-badge">EDUCATION PLATFORM</span>
      <div class="brand-title">모빌리티 SW 개론 및 프로세스</div>
      <div class="brand-sub">Mobility SW Introduction &amp; Process</div>
    </div>

    <div class="nav-section">
      <div class="nav-label">플랫폼 메뉴</div>
      <button class="nav-item active" data-view="home" onclick="navigate('home')">🏠 HOME (학습 홈)</button>
      <button class="nav-item" data-view="curriculum" onclick="navigate('curriculum')">🗺️ 전체 교육과정 로드맵</button>
    </div>

    <div class="nav-section">
      <div class="nav-label">트랙별 이론 학습 (17단원)</div>
      <div id="sidebar-tracks"></div>
    </div>

    <div class="nav-section">
      <div class="nav-label">실습 · 사전 · 평가 · 기록</div>
      <button class="nav-item" data-view="lab" onclick="navigate('lab')">🔬 인터랙티브 실습실</button>
      <button class="nav-item" data-view="glossary" onclick="navigate('glossary')">📖 모빌리티 SW 용어 사전</button>
      <button class="nav-item" data-view="quiz" onclick="navigate('quiz')">📝 퀴즈 및 종합 평가</button>
      <button class="nav-item" data-view="dashboard" onclick="navigate('dashboard')">📊 나의 학습 기록 (LMS)</button>
    </div>

    <div class="sidebar-footer">
      ※ 본 플랫폼은 「모빌리티 SW 개론 및 프로세스」 교재 내용을 기반으로 제작된 교육용 인터랙티브 학습 시스템입니다.
    </div>
  </aside>

  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <!-- Sticky Top Header -->
    <header class="top-header">
      <div class="header-left">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="breadcrumb" id="breadcrumb"><strong>HOME</strong> / 학습 개요</div>
      </div>
      <div class="header-right">
        <div class="progress-widget" title="전체 17개 단원 완료율">
          <span class="progress-label">전체 진도율</span>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="top-progress-fill"></div>
          </div>
          <span class="progress-pct" id="top-progress-pct">0%</span>
        </div>
        <button class="btn btn-outline btn-sm" onclick="toggleMemoDrawer()">📝 학습 메모</button>
      </div>
    </header>

    <!-- Main Dynamic View -->
    <main class="content-container" id="main-view"></main>
  </div>
</div>

<!-- Memo Slide Drawer -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="toggleMemoDrawer()"></div>
<aside class="memo-drawer" id="memo-drawer">
  <div class="drawer-header">
    <div>
      <div style="font-size:15px;font-weight:700;">📝 개인 학습 메모장</div>
      <div style="font-size:11.5px;opacity:0.8;" id="memo-target-label">전체 공통 메모</div>
    </div>
    <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;" onclick="toggleMemoDrawer()">닫기 ✕</button>
  </div>
  <div class="drawer-body">
    <div>
      <label style="font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px;">메모 대상 단원 선택</label>
      <select id="memo-unit-select" class="input-control" style="width:100%;" onchange="loadMemoForSelectedUnit()"></select>
    </div>
    <div>
      <label style="font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px;">핵심 정리 및 질문 메모</label>
      <textarea id="memo-input" class="memo-textarea" placeholder="학습하면서 이해한 핵심 개념, 헷갈리는 용어, 복습할 내용을 자유롭게 기록하세요. 브라우저에 자동 저장됩니다."></textarea>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveCurrentMemo()">💾 메모 저장하기</button>

  { id:'q53', track:'track2', unitId:'u2-5', type:'상황 판단', q:'[실무 상황] 한 고성능 SoC 내부에 인포테인먼트(Adaptive)와 차량 안전 경고(Classic/Safety) 기능을 함께 탑재하려고 한다. 가장 우선적으로 고려해야 할 설계 주의점은?', options:['Safety/Security Partition 격리(Freedom From Interference)를 통해 인포테인먼트 오류가 안전 영역에 침범하지 못하게 한다.','두 영역이 모든 메모리 주소를 자유롭게 덮어쓰도록 허용한다.','보안 방화벽을 모두 해제해 통신 지연을 없앤다.','Safety 영역의 Watchdog 감시를 완전히 비활성화한다.'], ans:0, exp:'교재 1-24에 따라 HPC 환경에서 복합 기능을 통합할 때는 Safety/Security Partition 격리를 통해 상호 간섭을 차단해야 합니다.' },

  { id:'q11', track:'track3', unitId:'u3-1', type:'객관식', q:'V-Model 개발 생명주기에서 "SW 아키텍처 설계(SWE.2)" 산출물을 직접적인 합격 기준으로 삼아 수행하는 우측 검증 단계는?', options:['SW 통합 검증 (SWE.5)','SW 단위 검증 (SWE.4)','필드 폐기 검증','공장 도장 품질 검사'], ans:0, exp:'V-Model에서는 SWE.3 상세설계 ↔ SWE.4 단위검증, SWE.2 아키텍처 ↔ SWE.5 통합검증, SWE.1 요구사항 ↔ SWE.6 요구사항검증이 1:1 대칭을 이룹니다.' },
  { id:'q12', track:'track3', unitId:'u3-2', type:'객관식', q:'ASPICE에서 요구사항 ↔ 설계 ↔ 코드 ↔ 테스트 케이스 간의 ID 연결 관계와 내용 정합성을 동시에 요구하는 핵심 개념은?', options:['양방향 추적성(Bidirectional Traceability)과 일관성(Consistency)','단방향 구두 보고와 임의 코딩','하드웨어 리버스 엔지니어링','무작위 변수명 생성'], ans:0, exp:'ASPICE에서는 상위-하위 산출물 간 양방향 추적성 링크뿐 아니라 내용이 모순 없이 일치하는 일관성(Consistency) 증거가 필수입니다.' },
  { id:'q13', track:'track3', unitId:'u3-3', type:'객관식', q:'특정 마일스톤이나 양산 릴리즈 시점에 검증 완료된 문서, 소스코드, ARXML, 빌드 툴 버전을 동결(Freeze)해 언제든 동일 빌드를 재현하게 해주는 형상 관리 개념은?', options:['베이스라인 (Baseline)','브레인스토밍 (Brainstorming)','오버플로우 (Overflow)','폴링 (Polling)'], ans:0, exp:'형상 관리(SUP.8)에서 Baseline은 특정 시점의 형상 항목 집합을 공식 확정·동결하여 향후 빌드 재현성과 변경 비교의 기준이 됩니다.' },
  { id:'q14', track:'track3', unitId:'u3-4', type:'객관식', q:'시스템의 하드웨어나 소프트웨어 고장(Fault)이 전혀 없는 정상 상태에서도, 폭우·역광·센서 인지 한계로 발생하는 위험을 다루는 안전 표준은?', options:['SOTIF (ISO 21448)','ISO 26262 (기능안전)','LIN 2.2A','USB 3.0'], ans:0, exp:'SOTIF(Safety Of The Intended Functionality, ISO 21448)는 고장(Fault)이 아닌 의도된 기능 자체의 성능·인지 한계와 유발 조건으로 인한 위험을 최소화합니다.' },
  { id:'q15', track:'track3', unitId:'u3-5', type:'객관식', q:'ISO/SAE 21434 사이버보안 엔지니어링에서 보호 자산을 식별하고 위협 시나리오의 피해 영향도와 공격 실현 가능성을 평가하는 핵심 기법은?', options:['TARA (Threat Analysis and Risk Assessment)','HARA (Hazard Analysis and Risk Assessment)','PWM (Pulse Width Modulation)','ADC (Analog-to-Digital Conversion)'], ans:0, exp:'기능안전(ISO 26262)에서는 HARA를 통해 ASIL을 산정하고, 사이버보안(ISO/SAE 21434)에서는 TARA를 통해 위협과 위험도를 평가합니다.' },
  { id:'q70', track:'track3', unitId:'u3-7', type:'상황 판단', q:'[실무 시나리오 5] 차량 폐기(Decommissioning) 단계에서 폐차장이나 제3자가 제어기 메모리에서 OEM의 비밀 암호 키와 운전자 개인정보를 추출하지 못하도록 조치해야 한다. 이는 어떤 표준의 요구사항인가?', options:['ISO/SAE 21434 (전 수명주기 사이버보안 — 폐기 단계 보안)','AUTOSAR Classic PWM 설정','LIN 통신 슬레이브 주소 할당','차체 용접 강도 시험'], ans:0, exp:'ISO/SAE 21434는 기획·개발·양산·운영뿐만 아니라 폐기(Decommissioning) 단계에서의 암호 키 및 민감 데이터 안전한 삭제까지 요구합니다.' },
  /* 2일차 Part 1 교재 추가 문항 */
  { id:'q71', track:'track3', unitId:'u3-1', type:'객관식', q:'Software Engineering(SE)의 관점에서 "Software"에 대한 가장 정확한 정의는?', options:['실행 가능한 컴퓨터 프로그램 코드만을 의미한다.','컴퓨터 프로그램 코드 + 관련 문서 + 개발 후 장기간 유지·지원되는 Product가 결합된 것이다.','하드웨어 반도체 칩 그 자체를 의미한다.','오직 한 명의 개발자가 한 번 실행하고 폐기하는 스크립트이다.'], ans:1, exp:'교재 2일차 Part 1(p.5)에 따라 Software는 단순 코드만이 아니라 코드, 관련 문서, 그리고 장기간 유지·지원되는 Product 책임이 결합된 개념입니다.' },
  { id:'q72', track:'track3', unitId:'u3-1', type:'객관식', q:'Computer Science(CS)와 Software Engineering(SE)의 차이를 가장 바르게 설명한 것은?', options:['CS는 계산 이론·알고리즘·자료구조 등 이론적 원리를 다루고, SE는 고객 문제를 실제 SW 제품으로 해결하기 위해 도구·방법론·프로세스를 조직적으로 적용하는 공학이다.','CS와 SE는 완전히 동일한 학문으로 역할 분담이 없다.','SE는 수학 이론만 연구하고 제품 개발에는 관여하지 않는다.','CS는 오직 자동차 하드웨어 용접 기술만을 다룬다.'], ans:0, exp:'SE는 CS 지식을 바탕으로 다수 역할과 버전이 얽힌 현실의 대규모 제품 개발 문제를 해결하는 공학 영역입니다.' },
  { id:'q73', track:'track3', unitId:'u3-1', type:'객관식', q:'Software Engineering이 관리해야 하는 4대 핵심 이슈(4C)에 해당하지 않는 것은?', options:['Complexity (복잡성)','Cost (비용 — 특히 재작업·유지보수 비용)','Change (변경 — 수정 시 부작용 및 회귀 검증)','Coloring (차량 외장 도색 색상)'], ans:3, exp:'SE의 4C는 Complexity(복잡성), Cost(비용), Change(변경), Communication(의사소통)입니다.' },
  { id:'q74', track:'track3', unitId:'u3-1', type:'객관식', q:'하드웨어 고장과 비교한 소프트웨어 고장(Reliability) 특성에 대한 설명으로 옳은 것은?', options:['SW는 물리적 마모(욕조 곡선)로 고장 나지는 않지만, 기능 추가나 버그 수정(Change) 과정에서 새로운 결함이 유입될 수 있으므로 회귀 검증(Regression Verification)이 필수이다.','SW는 시간이 지나면 구리선이 녹슬어 자연 마모된다.','SW는 한 번 수정하면 절대 기존 기능에 부작용이 생기지 않는다.','HW는 수정할 때마다 새로운 버그가 무한히 증식한다.'], ans:0, exp:'교재 2일차 Part 1(p.24)의 Reliability 비교처럼 HW는 마모(Bath-tub curve) 특성을 갖지만, SW는 변경으로 결함이 유입되므로 회귀 검증이 필수입니다.' },
  { id:'q75', track:'track3', unitId:'u3-1', type:'객관식', q:'Software Engineering의 6대 핵심 원칙 중 "복잡한 문제를 요구사항 분석·설계·구현·테스팅 또는 단위·통합·시스템 테스트로 나누어 다루는 원리"는?', options:['관심사의 분할 (Separation of Concerns)','무작위 코딩 (Random Coding)','단일 파일 집중화 (Monolithic Packing)','변경 금지 원칙 (Freeze Forever)'], ans:0, exp:'관심사의 분할(Separation of Concerns)은 복잡한 개발 및 검증 문제를 단계·관점별로 분리하여 통제하는 핵심 SE 원칙입니다.' },
  { id:'q76', track:'track3', unitId:'u3-2', type:'객관식', q:'Black Box Process와 비교한 White Box Process의 특징으로 옳은 것은?', options:['중간 활동·산출물·검토 기준·품질 Gate가 투명하게 보여 Process Quality를 통해 Product Quality를 높일 수 있다.','내부 산출물과 진척 상태를 전혀 볼 수 없어 최종 결과물만 기다려야 한다.','ASPICE 심사에서는 Black Box Process만을 합격 기준으로 삼는다.','문제 발생 시 원인 추적이 원천 불가능하다.'], ans:0, exp:'ASPICE 평가가 산출물과 리뷰 증거를 요구하는 이유는 개발 과정이 투명하게 관리되는 White Box Process임을 확인하기 위해서입니다.' },
  { id:'q77', track:'track3', unitId:'u3-2', type:'객관식', q:'공식적인 요구 분석 명세서나 설계 없이 일단 코드를 작성해 제품을 만든 뒤 문제가 생기면 수정하는 방식으로, 자동차 SW처럼 안전·추적성이 필요한 영역에 부적합한 모델은?', options:['Build-and-Fix (Code-and-Fix) 모델','V-Model','Spiral 모델','ASPICE 기반 DevOps 모델'], ans:0, exp:'Build-and-Fix 모델은 산출물과 아키텍처가 부재하여 대규모 협업과 안전·보안·추적성이 필수인 자동차 SW에는 매우 위험합니다.' },
  { id:'q78', track:'track3', unitId:'u3-2', type:'객관식', q:'Prototyping(프로토타이핑) 모델에서 제작한 프로토타입의 본질적 가치와 올바른 활용법은?', options:['프로토타입의 가치는 최종 양산 코드 그 자체가 아니라, 사용자와 의사소통하여 모호한 요구사항을 더 정확히 발견·보완하는 도구라는 데 있다.','프로토타입 코드를 검증 없이 그대로 양산 차량 브레이크 ECU에 탑재한다.','요구사항이 100% 명확할 때만 프로토타입을 만든다.','고객 평가를 생략하고 개발자 혼자 만족하면 종료한다.'], ans:0, exp:'교재 2일차 Part 1(p.50)에 따라 Prototype은 최종 제품이 아니라 사용자 요구를 정확히 이해하기 위한 의사소통 도구입니다.' },
  { id:'q79', track:'track3', unitId:'u3-2', type:'객관식', q:'반복 개발과 위험 분석(Risk Analysis)을 결합하여 Planning → Risk Analysis → Development → Evaluation 4단계를 나선형으로 순환하며 고위험을 조기 해소하는 모델은?', options:['Spiral Model (나선형 모델)','Build-and-Fix 모델','단순 선형 Waterfall 모델','비연결형 오프라인 모델'], ans:0, exp:'Spiral Model은 위험이 큰 프로젝트에서 반복 주기마다 위험 요소를 식별·분석·해소하며 진화하는 모델입니다.' },
  { id:'q80', track:'track3', unitId:'u3-2', type:'객관식', q:'Agile Scrum 프레임워크에서 "제품에 필요한 기능·개선·버그 등 요구사항의 우선순위가 정해진 전체 목록"을 무엇이라 하는가?', options:['Product Backlog (제품 백로그)','Sprint Retrospective (회고록)','MISRA Rule Table','CAN Matrix'], ans:0, exp:'Scrum의 3대 산출물은 Product Backlog(전체 우선순위 목록), Sprint Backlog(이번 스프린트 작업 계획), Increment(완성 결과물)입니다.' },
  { id:'q81', track:'track3', unitId:'u3-2', type:'OX 퀴즈', q:'[OX] Process Tailoring은 개발 일정을 단축하기 위해 안전·보안 검증과 요구사항·설계 문서를 임의로 생략하는 것을 의미한다.', options:['O (맞다)','X (틀리다)'], ans:1, exp:'교재 2일차 Part 1(p.64)에 따라 Process Tailoring은 생략이 아니라 제품 위험도, 팀 역량, 고객 요구, 규제 수준에 맞춰 합리적 근거 아래 통제 수준을 조정하는 활동입니다.' },

  { track:'track3', unitId:'u3-2', type:'상황 판단', q:'[실무 시나리오 4] 코드 리뷰 중 요구사항(SWE.1)이나 아키텍처(SWE.2) 어디에도 근거가 없는 숨겨진 기능 코드가 발견되었다. 이는 어떤 추적성 원칙에 위배되는가?', options:['역방향 추적성(Backward Traceability — 코드에서 상위 요구사항으로의 근거 추적 불가)','순방향 네트워크 대역폭 초과','하드웨어 핀 납땜 불량','전력 소모 최적화'], ans:0, exp:'모든 구현 코드와 테스트는 상위 설계와 요구사항으로 역추적(Backward Traceability)될 수 있어야 하며, 근거 없는 코드는 잠재적 위험 요소입니다.' },

  { track:'track3', unitId:'u3-3', type:'OX 퀴즈', q:'[OX] 형상 관리(SUP.8)는 소스 코드(.c/.h)뿐만 아니라 요구사항 명세서, ARXML 모델, 테스트 케이스, 빌드 도구 버전까지 포함해 관리해야 한다.', options:['O (맞다)','X (틀리다)'], ans:0, exp:'빌드 재현성과 수명주기 추적을 위해 코드, 문서, 모델, 테스트 및 개발 환경 정보까지 형상 항목으로 관리해야 합니다.' },
  { track:'track3', unitId:'u3-4', type:'객관식', q:'ISO 26262에서 고장이 발생한 순간부터 위험한 사고가 발생하기 전까지 시스템이 안전 상태(Safe State)로 전환을 완료해야 하는 허용 시간은?', options:['FTTI (Fault Tolerant Time Interval)','MTBF (Mean Time Between Failures)','OTA Download Time','Bootloader Standby Time'], ans:0, exp:'FTTI(결함 허용 시간 간격) 내에 고장을 감지하고 안전 상태로 천이해야 위험원(Hazard)을 예방할 수 있습니다.' },

/* ==========================================================================
   4. PERSISTENT STATE MANAGEMENT (localStorage)
   ========================================================================== */
const STORAGE_KEY = 'mobility_sw_lms_v1';

let appState = {
  view: 'home',         // home | curriculum | lesson | lab | glossary | quiz | dashboard
  activeLessonId: 'u1-1',
  openTracks: { track1: true, track2: false, track3: false },
  completedUnits: [],   // array of unitIds
  bookmarks: [],        // array of unitIds
  memos: {},            // { [unitId]: string }
  lastVisitedUnit: 'u1-1',
  quizHistory: [],      // [{ date, mode, score, total, pct }]
  wrongNotes: [],       // [{ id, q, options, ans, userAns, exp, unitId, track }]
  // Active quiz session state
  currentQuiz: null,
  labTab: 'ee',
  labSelection: { ee: 'zonal', vmodel: 'swe1', matrix: 'all', scenarioIdx: 0, aebStep: 0, clsDomain: 'all', clsSelected: null }
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) {
      appState = {
        ...appState,
        completedUnits: saved.completedUnits || [],
        bookmarks: saved.bookmarks || [],
        memos: saved.memos || {},
        lastVisitedUnit: saved.lastVisitedUnit || 'u1-1',
        quizHistory: saved.quizHistory || [],
        wrongNotes: saved.wrongNotes || []
      };
    }
  } catch (e) { console.warn('State load skipped:', e); }
}

function saveState() {
  try {
    const toSave = {
      completedUnits: appState.completedUnits,
      bookmarks: appState.bookmarks,
      memos: appState.memos,
      lastVisitedUnit: appState.lastVisitedUnit,
      quizHistory: appState.quizHistory,
      wrongNotes: appState.wrongNotes
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) { console.warn('State save skipped:', e); }
  updateGlobalProgress();
}

function updateGlobalProgress() {
  const total = LESSONS.length;
  const done = appState.completedUnits.length;
  const pct = Math.round((done / total) * 100);
  const fill = document.getElementById('top-progress-fill');
  const pctEl = document.getElementById('top-progress-pct');
  if (fill) fill.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
}

/* ==========================================================================
   5. NAVIGATION & SIDEBAR RENDERING
   ========================================================================== */
function renderSidebar() {
  const container = document.getElementById('sidebar-tracks');
  container.innerHTML = TRACKS.map(track => {
    const units = LESSONS.filter(l => l.trackId === track.id);
    const doneCount = units.filter(u => appState.completedUnits.includes(u.id)).length;
    const isOpen = !!appState.openTracks[track.id];
    return `
      <div class="track-group">
        <button class="track-header" onclick="toggleTrackAccordion('${track.id}')">
          <span>${track.code}. ${track.title.split(' 및 ')[0]}</span>
          <span style="font-size:11px;opacity:0.8;">${doneCount}/${units.length} ${isOpen ? '▾' : '▸'}</span>
        </button>
        <div class="unit-list ${isOpen ? 'open' : ''}">
          ${units.map(u => {
            const isDone = appState.completedUnits.includes(u.id);
            const isActive = appState.view === 'lesson' && appState.activeLessonId === u.id;
            return `
              <button class="unit-btn ${isActive ? 'active' : ''}" onclick="openLesson('${u.id}')">
                <span class="status-dot ${isDone ? 'done' : ''}"></span>
                <span>${u.num} ${u.title.split(':')[0]}</span>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  // Highlight top-level nav items
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === appState.view);
  });
}

function toggleTrackAccordion(trackId) {
  appState.openTracks[trackId] = !appState.openTracks[trackId];
  renderSidebar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function navigate(view) {
  appState.view = view;
  document.getElementById('sidebar').classList.remove('open');
  renderSidebar();
  renderMainView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openLesson(lessonId) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson) return;
  appState.view = 'lesson';
  appState.activeLessonId = lessonId;
  appState.lastVisitedUnit = lessonId;
  appState.openTracks[lesson.trackId] = true;
  saveState();
  document.getElementById('sidebar').classList.remove('open');
  renderSidebar();
  renderMainView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateBreadcrumb(html) {
  document.getElementById('breadcrumb').innerHTML = html;
}

/* ==========================================================================
   6. VIEW RENDERERS (HOME, CURRICULUM, 8-SECTION LESSON, LAB, GLOSSARY, QUIZ, LMS)
   ========================================================================== */
function renderMainView() {
  const main = document.getElementById('main-view');
  switch (appState.view) {
    case 'home': main.innerHTML = renderHomeView(); break;
    case 'curriculum': main.innerHTML = renderCurriculumView(); break;
    case 'lesson': main.innerHTML = renderLessonView(appState.activeLessonId); break;
    case 'lab': main.innerHTML = renderLabView(); break;
    case 'glossary': main.innerHTML = renderGlossaryView(); break;
    case 'quiz': main.innerHTML = renderQuizView(); break;
    case 'dashboard': main.innerHTML = renderDashboardView(); break;
    default: main.innerHTML = renderHomeView();
  }
}

                    <button class="btn btn-primary btn-sm" onclick="openLesson('${u.id}')">학습하기 →</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function checkInlineQuiz(qId, selectedIdx, btnEl) {
  const qObj = QUIZ_QUESTIONS.find(q => q.id === qId);
  if (!qObj) return;
  const parent = document.getElementById('inline-quiz-options');
  parent.querySelectorAll('.quiz-option').forEach((b, i) => {
    b.classList.remove('selected', 'correct', 'wrong');
    if (i === qObj.ans) b.classList.add('correct');
    else if (i === selectedIdx) b.classList.add('wrong');
  });
  const fb = document.getElementById('inline-quiz-feedback');
  const isCorrect = selectedIdx === qObj.ans;
  fb.style.display = 'block';
  fb.style.background = isCorrect ? 'var(--success-bg)' : 'var(--danger-bg)';
  fb.style.color = isCorrect ? '#064E3B' : '#7F1D1D';
  fb.innerHTML = `<div style="font-weight:700;margin-bottom:4px;">${isCorrect ? '✓ 정답입니다!' : '✕ 오답입니다. (정답: ' + (qObj.ans + 1) + '번)'}</div><div>${qObj.exp}</div>`;
  if (!isCorrect) addWrongNote(qObj, selectedIdx);
}

/* --- 6.6 QUIZ & ASSESSMENT CENTER (100-ITEM BANK, FISHER-YATES 15 RANDOM) --- */
function fisherYatesShuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startRandomQuiz(mode = 'all', unitId = null) {
  let pool = QUIZ_QUESTIONS;
  let modeLabel = '전 범위 종합 평가 (100문항 풀)';

  if (mode === 'track1' || mode === 'track2' || mode === 'track3') {
    pool = QUIZ_QUESTIONS.filter(q => q.track === mode);
    const tr = TRACKS.find(t => t.id === mode);
    modeLabel = `${tr.code}. ${tr.title} 평가`;
  } else if (mode === 'unit' && unitId) {
    pool = QUIZ_QUESTIONS.filter(q => q.unitId === unitId);
    const u = LESSONS.find(l => l.id === unitId);
    modeLabel = `단원 집중 복습 (${u.num} ${u.title.split(':')[0]})`;
  }

  const selected = fisherYatesShuffle(pool).slice(0, 15);
  appState.currentQuiz = {
    mode,
    unitId,
    modeLabel,
    questions: selected,
    userAnswers: new Array(selected.length).fill(null),
    submitted: false,
    score: 0
  };
  appState.view = 'quiz';
  renderSidebar();
  renderMainView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startTrackQuiz(trackId) {
  startRandomQuiz(trackId);
}

function selectQuizAnswer(qIdx, optIdx) {
  if (!appState.currentQuiz || appState.currentQuiz.submitted) return;
  appState.currentQuiz.userAnswers[qIdx] = optIdx;
  renderMainView();
}

function submitCurrentQuiz() {
  const qz = appState.currentQuiz;
  if (!qz) return;
  let correctCount = 0;
  qz.questions.forEach((q, idx) => {
    const uAns = qz.userAnswers[idx];
    if (uAns === q.ans) {
      correctCount++;
    } else {
      addWrongNote(q, uAns);
    }
  });
  qz.submitted = true;
  qz.score = correctCount;
  const pct = Math.round((correctCount / qz.questions.length) * 100);
  appState.quizHistory.unshift({
    date: new Date().toLocaleString('ko-KR'),
    modeLabel: qz.modeLabel,
    score: correctCount,
    total: qz.questions.length,
    pct
  });
  saveState();
  renderMainView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function addWrongNote(qObj, userAns) {
  const exists = appState.wrongNotes.findIndex(w => w.id === qObj.id);
  const entry = { ...qObj, userAns, savedAt: new Date().toLocaleDateString('ko-KR') };
  if (exists >= 0) appState.wrongNotes[exists] = entry;
  else appState.wrongNotes.unshift(entry);
  saveState();
}

function exportLearningSummary() {
  const payload = {
    exportedAt: new Date().toISOString(),
    completedUnits: appState.completedUnits,
    bookmarks: appState.bookmarks,
    memos: appState.memos,
    quizHistory: appState.quizHistory,
    wrongNotesCount: appState.wrongNotes.length
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const ta = document.createElement('textarea');
  ta.value = jsonStr;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
  } catch (e) { /* fallback ignored */ }
  document.body.removeChild(ta);
  const box = document.getElementById('export-feedback');
  if (box) {
    box.style.display = 'block';
    box.innerHTML = '✓ 학습 진도·메모·퀴즈 요약(JSON)이 클립보드에 복사되었습니다. 아래에서 직접 확인하실 수도 있습니다.<pre style="margin-top:8px;max-height:140px;overflow:auto;background:#fff;padding:10px;border-radius:6px;border:1px solid var(--slate-border);font-size:11.5px;">' + jsonStr.replace(/</g, '&lt;') + '</pre>';
  }
}

              <div style="border:1px solid #FECACA;background:#FFFDFD;border-radius:8px;padding:16px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                  <span class="badge badge-sup">오답 기록 · ${w.savedAt}</span>
                  <button class="btn btn-outline btn-sm" onclick="removeWrongNote(${wi})">복습 완료 (삭제)</button>
                </div>
                <div style="font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:8px;">${w.q}</div>
                <div style="font-size:13px;color:var(--danger);margin-bottom:4px;">• 내가 선택한 답: ${w.userAns !== null && w.userAns !== undefined ? (w.userAns + 1) + '. ' + w.options[w.userAns] : '미응답'}</div>
                <div style="font-size:13px;color:var(--success);font-weight:700;margin-bottom:6px;">• 정답: ${w.ans + 1}. ${w.options[w.ans]}</div>
                <div style="font-size:13px;color:var(--text-sub);background:var(--slate);padding:10px;border-radius:6px;">${w.exp}</div>
                ${u ? `<div style="margin-top:8px;"><button class="btn btn-outline btn-sm" onclick="openLesson('${u.id}')">📖 관련 단원 학습하기 (${u.num})</button></div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

function removeWrongNote(idx) {
  appState.wrongNotes.splice(idx, 1);
  saveState();
  renderMainView();
}

/* ==========================================================================
   7. UNIT COMPLETION, BOOKMARKS & SLIDE MEMO DRAWER
   ========================================================================== */
function toggleCompleteUnit(unitId) {
  const idx = appState.completedUnits.indexOf(unitId);
  if (idx >= 0) appState.completedUnits.splice(idx, 1);
  else appState.completedUnits.push(unitId);
  saveState();
  renderSidebar();
  renderMainView();
}

function toggleBookmark(unitId) {
  const idx = appState.bookmarks.indexOf(unitId);
  if (idx >= 0) appState.bookmarks.splice(idx, 1);
  else appState.bookmarks.push(unitId);
  saveState();
  renderMainView();
}

function initMemoDrawerOptions() {
  const sel = document.getElementById('memo-unit-select');
  sel.innerHTML = `<option value="general">전체 공통 학습 메모</option>` +
    LESSONS.map(l => `<option value="${l.id}">단원 ${l.num}. ${l.title.split(':')[0]}</option>`).join('');
}

function toggleMemoDrawer() {
  const drawer = document.getElementById('memo-drawer');
  const backdrop = document.getElementById('drawer-backdrop');
  const willOpen = !drawer.classList.contains('open');
  if (willOpen) {
    initMemoDrawerOptions();
    const targetId = appState.view === 'lesson' ? appState.activeLessonId : 'general';
    document.getElementById('memo-unit-select').value = targetId;
    loadMemoForSelectedUnit();
    renderMemoPreviewList();
  }
  drawer.classList.toggle('open', willOpen);
  backdrop.classList.toggle('open', willOpen);
}

function scrollToSec(secId) {
  const el = document.getElementById(secId);
  if (el) {
    const headerOffset = 80;
    const elementPosition = el.getBoundingClientRect().top;
    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
  }
}

function openMemoForUnit(unitId) {
  initMemoDrawerOptions();
  document.getElementById('memo-unit-select').value = unitId;
  loadMemoForSelectedUnit();
  renderMemoPreviewList();
  document.getElementById('memo-drawer').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
}

function loadMemoForSelectedUnit() {
  const uid = document.getElementById('memo-unit-select').value;
  const u = LESSONS.find(l => l.id === uid);
  document.getElementById('memo-target-label').textContent = u ? `단원 ${u.num} · ${u.title.split(':')[0]}` : '전체 공통 학습 메모';
  document.getElementById('memo-input').value = appState.memos[uid] || '';
  document.getElementById('memo-saved-msg').style.display = 'none';
}

function saveCurrentMemo() {
  const uid = document.getElementById('memo-unit-select').value;
  appState.memos[uid] = document.getElementById('memo-input').value;
  saveState();
  document.getElementById('memo-saved-msg').style.display = 'block';
  renderMemoPreviewList();
  if (appState.view === 'dashboard') renderMainView();
}

function clearCurrentMemo() {
  document.getElementById('memo-input').value = '';
  saveCurrentMemo();
}

function renderMemoPreviewList() {
  const preview = document.getElementById('memo-list-preview');
  const entries = Object.entries(appState.memos).filter(([_, v]) => v && v.trim());
  if (entries.length === 0) {
    preview.innerHTML = '아직 저장된 메모가 없습니다.';
    return;
  }
  preview.innerHTML = entries.map(([uid, txt]) => {
    const u = LESSONS.find(l => l.id === uid);
    return `<div style="padding:8px;background:var(--slate);border-radius:6px;margin-bottom:6px;cursor:pointer;" onclick="document.getElementById('memo-unit-select').value='${uid}';loadMemoForSelectedUnit();">
      <strong style="color:var(--navy);">${u ? u.num + ' ' + u.title.split(':')[0] : '공통 메모'}</strong>
      <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${txt}</div>
    </div>`;
  }).join('');
}

/* ==========================================================================
   8. BOOTSTRAP APPLICATION
   ========================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  loadState();
  updateGlobalProgress();
  renderSidebar();
  renderMainView();
});
</script>
</body>
</html>
