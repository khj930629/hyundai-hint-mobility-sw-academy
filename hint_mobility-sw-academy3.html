<script>
// ============================================================================
// 1. STATE & LOCALSTORAGE MANAGEMENT
// ============================================================================
const STORAGE_KEY = 'automotive_sw_testing_academy_v2';
const defaultState = {
  completedUnits: [],
  lastUnitId: 'u1_1',
  quizHistory: [],
  wrongNotes: [],
  questionStats: {}
};

function loadState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...defaultState };
    const parsed = JSON.parse(raw);
    return {
      completedUnits: Array.isArray(parsed.completedUnits) ? parsed.completedUnits : [],
      lastUnitId: parsed.lastUnitId || 'u1_1',
      quizHistory: Array.isArray(parsed.quizHistory) ? parsed.quizHistory : [],
      wrongNotes: Array.isArray(parsed.wrongNotes) ? parsed.wrongNotes : [],
      questionStats: parsed.questionStats && typeof parsed.questionStats === 'object' ? parsed.questionStats : {}
    };
  } catch (e) {
    return { ...defaultState };
  }
}

let appState = loadState();

function saveState() {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {}
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (!sidebar || !backdrop) return;
  const isClosed = sidebar.classList.contains('-translate-x-full');
  sidebar.classList.toggle('-translate-x-full', !isClosed);
  backdrop.classList.toggle('hidden', !isClosed);
}

function showModal(title, bodyHtml, buttons = []) {
  const modal = document.getElementById('custom-modal');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const footer = document.getElementById('modal-footer');
  footer.innerHTML = '';
  const btns = buttons.length ? buttons : [{ label: '확인', primary: true, onClick: closeModal }];
  btns.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    btn.className = b.primary
      ? 'px-4 py-2 bg-hyundai-navy hover:bg-blue-900 text-white rounded-lg text-xs font-bold transition'
      : 'px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition';
    btn.onclick = b.onClick || closeModal;
    footer.appendChild(btn);
  });
  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('custom-modal').classList.add('hidden');
}

function openStorageInfoModal() {
  showModal('학습 데이터 저장 및 환경 안내', `
    <p><strong>저장 방식:</strong> 본 플랫폼은 백엔드 서버 없이 브라우저 내장 <code>LocalStorage</code>를 사용하여 학습 진도율, 퀴즈 응시 기록, 오답 노트 및 취약 개념 통계를 자동 보존합니다.</p>
    <p class="text-xs text-slate-500">• 동일 PC/모바일 브라우저 환경에서는 새로고침 또는 재접속 시에도 학습 이력이 유지됩니다.<br>• 시크릿 창 사용이나 브라우저 캐시 삭제 시 저장 데이터가 초기화될 수 있습니다.</p>
  `);
}

function confirmResetProgress() {
  showModal('학습 기록 초기화 확인', '<p>모든 단원 완료 기록, 퀴즈 성적, 오답 노트가 영구 삭제됩니다. 초기화하시겠습니까?</p>', [
    { label: '취소', primary: false, onClick: closeModal },
    {
      label: '초기화 실행',
      primary: true,
      onClick: () => {
        appState = { ...defaultState, completedUnits: [], quizHistory: [], wrongNotes: [], questionStats: {} };
        saveState();
        updateGlobalProgressUI();
        renderSidebar();
        closeModal();
        navigateTo('dashboard');
      }
    }
  ]);
}

// ============================================================================
// 2. CURRICULUM DATA (ALL 22 UNITS ACROSS CHAPTER 01 ~ 05, 10-STEP STRUCTURE)
// ============================================================================
function makeUnit(cfg) {
  return {
    id: cfg.id,
    chapter: cfg.chapter,
    title: cfg.title,
    pages: cfg.pages,
    simType: cfg.simType,
    simTitle: cfg.simTitle,
    objectives: cfg.objectives,
    coreConcepts: cfg.coreConcepts,
    theory: cfg.theory,
    mechanism: cfg.mechanism,
    background: cfg.background,
    ecuCase: cfg.ecuCase,
    comparison: cfg.comparison,
    summary: cfg.summary,
    checkQuiz: cfg.checkQuiz
  };
}

const CURRICULUM_UNITS = [
  // -------------------- CHAPTER 01 (5 Units) --------------------
  makeUnit({
    id: 'u1_1', chapter: 'Chapter 01. Software Testing 개론 및 표준',
    title: '1.1 Software Testing 개념과 V&V 차이', pages: '교재 p.3~4, p.13',
    simType: 'iso29119', simTitle: 'ISO 29119 & V&V 테스트 수행 레벨 아키텍처',
    objectives: [
      'Software Testing의 본질적 목적과 결함 예방·조기 발견 원리를 설명할 수 있다.',
      'Verification(검증)과 Validation(확인)의 관점·수행 시점·대상의 차이를 명확히 구분할 수 있다.',
      '정적 검증부터 실차 Validation까지 이어지는 자동차 SW 공통 Test 수행 레벨을 이해한다.'
    ],
    coreConcepts: [
      { term: 'Software Testing (소프트웨어 테스팅)', desc: '실행 전 정적 분석과 실행 기반 동적 시험을 통해 요구사항 충족 여부와 잠재 결함을 식별하는 체계적 엔지니어링 활동' },
      { term: 'Verification (검증)', desc: '"제품을 올바르게 만들고 있는가(Are we building the product right?)" — 요구사항·설계 명세 대비 구현 일치성 확인 (SWE.4~6, SYS.4~5)' },
      { term: 'Validation (확인)', desc: '"올바른 제품을 만들었는가(Are we building the right product?)" — 실제 차량 운행 환경에서 사용자 의도 및 안전성 충족 확인 (VAL.1)' }
    ],
    theory: `자동차 전자제어장치(ECU) 소프트웨어는 하드웨어와 결합되어 실시간으로 물리적 차량 거동을 제어합니다. 단순한 실행 위주의 디버깅과 달리 체계적인 Software Testing은 <strong>계획 → 설계 → 수행 → 기록 → 종료</strong>의 생명주기를 따르며, 정적 검증(Static Analysis/Code Review)으로 컴파일 이전 결함을 먼저 제거한 뒤 동적 검증(Unit → Integration → SW Requirements → System/HIL → Vehicle Validation) 단계로 확장됩니다.`,
    mechanism: `1) <strong>정적 검증:</strong> 코드를 실행하지 않고 MISRA C 규칙 및 코드 리뷰로 결함 검출<br>2) <strong>Verification 단계:</strong> Unit Test(함수 단위) → Component/Integration Test(인터페이스·타이밍) → SW Requirements Test(요구사항 추적성) → System/HIL Test(실시간 환경 모사)<br>3) <strong>Validation 단계:</strong> 실차 및 주행시험장(Proving Ground)에서 실제 운전자의 사용 환경과 의도된 기능 안전성 최종 입증`,
    background: `차량 전동화·자율주행화로 ECU 코드 라인 수가 수천만 줄을 넘어가면서, 결함 발견 시점이 늦어질수록 수정 비용이 기하급수적으로 증가합니다. 따라서 앞단(Shift-Left)의 Verification과 최종 사용자 관점의 Validation을 명확히 분리하여 이중 안전망을 구축합니다.`,
    ecuCase: `<strong>Lamp Control Unit (LCU) 적용:</strong><br>• <strong>Verification:</strong> 배터리 전압 9.0~16.0V 범위에서 <code>LCU_SetLowBeam()</code> 함수가 PWM 듀티 80%를 출력하는지 단위/HIL 테스트로 검증.<br>• <strong>Validation:</strong> 실제 야간 빗길 주행 환경에서 운전자가 하향등 스위치를 켰을 때 전방 시야 확보와 눈부심 방지가 의도대로 작동하는지 차량 레벨로 확인.`,
    comparison: `<table class="min-w-full text-xs border border-slate-300"><thead class="bg-slate-100"><tr><th class="p-2 border">구분</th><th class="p-2 border">Verification (검증)</th><th class="p-2 border">Validation (확인)</th></tr></thead><tbody><tr><td class="p-2 border font-bold">핵심 질문</td><td class="p-2 border">명세대로 올바르게 구현했는가?</td><td class="p-2 border">사용자 의도와 실환경에 적합한가?</td></tr><tr><td class="p-2 border font-bold">기준 문서</td><td class="p-2 border">요구사항 명세서, 아키텍처, 상세설계서</td><td class="p-2 border">사용자 니즈, 실제 차량 운행 시나리오</td></tr><tr><td class="p-2 border font-bold">ASPICE 대응</td><td class="p-2 border">SWE.4, SWE.5, SWE.6, SYS.4, SYS.5</td><td class="p-2 border">VAL.1 (Validation)</td></tr></tbody></table>`,
    summary: [
      'Verification은 명세(Specification) 기준의 구현 정확성 검증이고, Validation은 실사용 환경 기준의 목적 적합성 확인이다.',
      '공통 Test 수행 레벨은 정적 검증 → Unit → Integration → SW Requirements → System/HIL → Validation 순으로 진행된다.'
    ],
    checkQuiz: {
      q: '실제 차량과 주행시험장 환경에서 사용자의 의도대로 기능이 안전하게 작동하는지 최종 확인하는 활동은 무엇인가?',
      options: ['Static Analysis', 'Unit Verification (SWE.4)', 'Validation (VAL.1)', 'MISRA Compliance Check'],
      ans: 2,
      exp: 'Validation(VAL.1)은 실제 사용 환경에서 제품이 의도된 목적과 요구를 충족하는지 확인하는 활동입니다.'
    }
  }),

  makeUnit({
    id: 'u1_2', chapter: 'Chapter 01. Software Testing 개론 및 표준',
    title: '1.2 ISO/IEC/IEEE 29119 (Part 1~4) & TMMi', pages: '교재 p.4~5',
    simType: 'iso29119', simTitle: 'ISO/IEC/IEEE 29119 4대 파트 유기적 구조 시뮬레이터',
    objectives: [
      'ISO/IEC/IEEE 29119의 산업 공통 프레임워크 성격과 Part 1~4 각각의 역할을 구분할 수 있다.',
      '기존 표준(BS 7925-1/2, IEEE 829, IEEE 1008)이 ISO 29119로 어떻게 통합되었는지 이해한다.',
      '테스트 방법론 표준(ISO 29119)과 조직 테스트 성숙도 모델(TMMi Level 1~5)의 차이를 설명할 수 있다.'
    ],
    coreConcepts: [
      { term: 'ISO/IEC/IEEE 29119', desc: '자동차 전용이 아닌 산업 전반에 적용 가능한 소프트웨어 테스팅 국제표준 프레임워크 ("어떻게 체계적으로 테스트할 것인가")' },
      { term: 'Part 1~4 구성', desc: 'Part 1(개념/용어) · Part 2(테스트 프로세스) · Part 3(테스트 문서화) · Part 4(테스트 설계 기법)' },

    theory: `단일 기능이나 개별 조건 검증을 넘어 시스템 수준의 흐름과 다수 파라미터 간 상호작용을 검증할 때 다음 기법들을 활용합니다.<br>1) <strong>Use Case Testing:</strong> 액터(Actor)와 시스템 간의 시나리오 흐름을 검증합니다. 기본 성공 시나리오(Main Flow)뿐만 아니라 정상적인 다른 선택 경로(Alternative Flow) 및 오류 중단 경로(Exception Flow)를 모두 포함합니다.<br>2) <strong>Classification Tree:</strong> 입력 조건을 트리 구조로 시각화해 중복과 누락 없이 조합표를 구성합니다.<br>3) <strong>Pairwise Testing:</strong> 소프트웨어 결함의 대다수가 1개 또는 2개 파라미터 간의 상호작용에서 발생한다는 경험적 근거에 기반하여, 전체 조합(예: 3×3×3×3 = 81개)을 약 9~11개의 핵심 조합으로 압축합니다.`,

function updateGlobalProgressUI() {
  const total = CURRICULUM_UNITS.length;
  const done = appState.completedUnits.length;
  const pct = Math.round((done / total) * 100);
  const topText = document.getElementById('top-progress-text');
  const topBar = document.getElementById('top-progress-bar');
  const sideCount = document.getElementById('sidebar-completed-count');
  if (topText) topText.textContent = `${pct}%`;
  if (topBar) topBar.style.width = `${pct}%`;
  if (sideCount) sideCount.textContent = `${done} / ${total} 완료`;
}

function toggleUnitComplete(unitId) {
  if (appState.completedUnits.includes(unitId)) {
    appState.completedUnits = appState.completedUnits.filter(id => id !== unitId);
  } else {
    appState.completedUnits.push(unitId);
  }
  saveState();
  updateGlobalProgressUI();
  renderSidebar();
  const unit = CURRICULUM_UNITS.find(u => u.id === unitId);
  if (unit) renderUnitPage(document.getElementById('main-content'), unit);
}

// ============================================================================
// 6. ROUTER
// ============================================================================
function navigateTo(route) {
  currentRoute = route;
  const main = document.getElementById('main-content');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
    sidebar.classList.add('-translate-x-full');
    backdrop.classList.add('hidden');
  }

  renderSidebar();
  if (!main) return;
  main.scrollTop = 0;

  if (route === 'dashboard') {
    renderDashboardView(main);
  } else if (route === 'quiz_random') {
    startQuizSession(main, 'random');
  } else if (route === 'quiz_chapter') {
    renderChapterQuizSelector(main);
  } else if (route === 'question_bank') {
    renderQuestionBankView(main);
  } else if (route === 'wrong_notes') {
    renderWrongNotesView(main);
  } else if (route === 'final_analysis') {
    renderFinalAnalysisView(main);
  } else if (route.startsWith('unit:')) {
    const unitId = route.slice(5);
    appState.lastUnitId = unitId;
    saveState();
    const unit = CURRICULUM_UNITS.find(u => u.id === unitId) || CURRICULUM_UNITS[0];
    renderUnitPage(main, unit);
  } else {
    renderDashboardView(main);
  }
}

// 7. VISUAL INTERACTIVE SIMULATORS (ALL 9 HANDS-ON SVG LABS)

function renderInteractiveLab(container, unit) {
  if (!container) return;
  switch (unit.simType) {
    case 'testEnvSim': renderTestEnvLab(container); break;
    case 'standardsMap': renderStandardsMapLab(container); break;
    case 'testDesignFlow': renderTestDesignFlowLab(container); break;
    case 'epSim': renderEPLab(container); break;
    case 'bvaSim': renderBVALab(container); break;
    case 'dtStSim': renderDTandSTLab(container); break;
    case 'stmtBranchSim': renderStmtBranchLab(container); break;
    case 'mcdcSim': renderMCDCLab(container); break;
    case 'funcCallSim': renderFuncCallLab(container); break;
    case 'ecuPracticeSim': renderECUPracticeLab(container); break;
    default: renderIso29119Explorer(container);
  }
}

      condOptions: [
        { id: 'c1', text: '유효 순방향 전이 (OFF → STANDBY → ON)', correct: true },
        { id: 'c2', text: '무효 전이 차단 (OFF 상태에서 Cmd=ON 입력 시 OFF 유지)', correct: true },

      ],
      techniques: ['Boundary Value Analysis', 'State Transition Testing', 'Pairwise Testing'],
      correctTechIdx: 1,
      generatedTCs: [
        { id: 'TC-04', input: 'State=OFF, Event=IGN_ON', exp: 'Next State = STANDBY' },
        { id: 'TC-05', input: 'State=STANDBY, Event=CMD_ON', exp: 'Next State = ON' },
        { id: 'TC-06', input: 'State=OFF, Event=CMD_ON', exp: 'Next State = OFF 유지' }
      ]
    }
  ];

  let curReqIdx = 0;
  let pickedConds = new Set(['c1']);
  let pickedTech = 0;

  container.innerHTML = `
    <div class="space-y-4">
      <div class="flex flex-wrap gap-2">
        ${reqs.map((r, i) => `<button onclick="switchFlowTask(${i})" id="flow-task-btn-${i}" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${i === 0 ? 'bg-hyundai-navy text-white border-hyundai-navy' : 'bg-white text-slate-700 border-slate-300'}">${r.title}</button>`).join('')}

    </div>

  window.switchFlowTask = (idx) => {
    curReqIdx = idx;
    pickedConds = new Set(['c1']);
    pickedTech = reqs[idx].correctTechIdx;

      document.getElementById(`flow-task-btn-${i}`).className = `px-3.5 py-2 rounded-xl text-xs font-bold border transition ${i === idx ? 'bg-hyundai-navy text-white border-hyundai-navy' : 'bg-white text-slate-700 border-slate-300'}`;

    renderPipeline();
  };

  window.toggleFlowCond = (cid) => {

    const r = reqs[curReqIdx];

    document.getElementById('flow-pipeline-grid').innerHTML = `

        { id: 'P2', label: 'Valid Normal', range: '9.0 ~ 16.0V', rec: 12.0, color: '#059669', bg: 'bg-emerald-50 border-emerald-400 text-emerald-900', out: 'Normal Operation (정상 점등 허용)', check: v => v >= 9.0 && v <= 16.0 },

      ]
    },
    {
      name: '사례 2: CAN PWM 밝기 명령 (5분할)', min: -10, max: 110, step: 1, defaultVal: 50, unit: '%',
      partitions: [
        { id: 'P1', label: 'Invalid <0%', range: '< 0%', rec: -5, color: '#E11D48', bg: 'bg-rose-50 border-rose-400 text-rose-900', out: 'Invalid Command (이전 출력 유지)', check: v => v < 0 },
        { id: 'P2', label: 'Valid 0%', range: '0%', rec: 0, color: '#475569', bg: 'bg-slate-100 border-slate-400 text-slate-900', out: 'Lamp OFF (완전 소등)', check: v => v === 0 },
        { id: 'P3', label: 'Valid 1~99%', range: '1 ~ 99%', rec: 50, color: '#059669', bg: 'bg-emerald-50 border-emerald-400 text-emerald-900', out: '비례 PWM 밝기 출력', check: v => v >= 1 && v <= 99 },
        { id: 'P4', label: 'Valid 100%', range: '100%', rec: 100, color: '#0284C7', bg: 'bg-sky-50 border-sky-400 text-sky-900', out: '최대 밝기 (Full ON)', check: v => v === 100 },
        { id: 'P5', label: 'Invalid >100%', range: '> 100%', rec: 105, color: '#D97706', bg: 'bg-amber-50 border-amber-400 text-amber-900', out: 'Invalid Command (이전 출력 유지)', check: v => v > 100 }
      ]
    }
  ];

  let domIdx = 0;

  container.innerHTML = `
    <div class="space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex gap-2">
          ${domains.map((d, i) => `<button onclick="switchEpDomain(${i})" id="ep-dom-btn-${i}" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${i === 0 ? 'bg-hyundai-navy text-white border-hyundai-navy' : 'bg-white text-slate-700 border-slate-300'}">${d.name}</button>`).join('')}
        </div>
        <div id="ep-cov-badge" class="px-3 py-1 rounded-full bg-blue-100 text-hyundai-navy text-xs font-extrabold">파티션 커버리지: 0%</div>
      </div>
      <div class="p-4 rounded-xl bg-slate-900 text-white space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span class="text-xs text-sky-300 font-bold">수직선 위 입력 포인터를 드래그하거나 각 파티션 블록을 클릭하세요</span>
          <span id="ep-cur-readout" class="text-lg font-mono font-extrabold text-amber-300"></span>
        </div>
        <input type="range" id="ep-range-slider" oninput="onEpSlide()" class="w-full">
        <div id="ep-visual-blocks" class="grid gap-2 pt-1"></div>
      </div>
      <div id="ep-verdict-banner" class="p-4 rounded-xl border-2 text-xs sm:text-sm"></div>
    </div>
  `;

  window.switchEpDomain = (idx) => {
    domIdx = idx;
    testedParts = new Set();
    domains.forEach((_, i) => {
      document.getElementById(`ep-dom-btn-${i}`).className = `px-3 py-1.5 rounded-lg text-xs font-bold border transition ${i === idx ? 'bg-hyundai-navy text-white border-hyundai-navy' : 'bg-white text-slate-700 border-slate-300'}`;
    });
    const d = domains[idx];
    const slider = document.getElementById('ep-range-slider');
    slider.min = d.min; slider.max = d.max; slider.step = d.step; slider.value = d.defaultVal;
    window.onEpSlide();
  };

  window.pickEpRep = (val) => { document.getElementById('ep-range-slider').value = val; window.onEpSlide(); };

  window.onEpSlide = () => {
    const d = domains[domIdx];
    const val = parseFloat(document.getElementById('ep-range-slider').value);
    document.getElementById('ep-cur-readout').textContent = `입력값 = ${val}${d.unit}`;
    let matched = d.partitions[0];
    d.partitions.forEach(p => { if (p.check(val)) matched = p; });
    testedParts.add(matched.id);

    const covPct = Math.round((testedParts.size / d.partitions.length) * 100);
    document.getElementById('ep-cov-badge').textContent = `파티션 커버리지: ${covPct}% (${testedParts.size}/${d.partitions.length} 구간 완료)`;

    const blocksEl = document.getElementById('ep-visual-blocks');
    blocksEl.style.gridTemplateColumns = `repeat(${d.partitions.length}, minmax(0, 1fr))`;
    blocksEl.innerHTML = d.partitions.map(p => {
      const isHit = p.id === matched.id;
      const wasVisited = testedParts.has(p.id);
      return `
        <button onclick="pickEpRep(${p.rec})" class="p-2.5 rounded-lg border-2 text-center transition ${isHit ? 'scale-105 shadow-lg border-yellow-300' : 'opacity-75 border-slate-600 hover:opacity-100'}" style="background-color: ${isHit ? p.color : '#1E293B'}">
          <div class="text-[11px] font-extrabold">${p.id}: ${p.label} ${wasVisited ? '✓' : ''}</div>
          <div class="text-[10px] font-mono mt-0.5 text-slate-200">${p.range}</div>
          <div class="mt-1.5 inline-block px-1.5 py-0.5 rounded bg-black/30 text-[10px] font-mono">대표: ${p.rec}${d.unit}</div>
        </button>
      `;
    }).join('');

    const banner = document.getElementById('ep-verdict-banner');
    banner.className = `p-4 rounded-xl border-2 ${matched.bg} space-y-1`;
    banner.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="font-extrabold">현재 활성 파티션: [${matched.id}] ${matched.label} (${matched.range})</span>
        <span class="text-xs font-mono font-bold">대표값 ${matched.rec}${d.unit} 와 동일 로직 처리</span>
      </div>
      <div><strong>기대 출력 (Expected Result):</strong> ${matched.out}</div>
    `;
  };
  window.switchEpDomain(0);
}

    { val: '9.1', x: 222, label: '9.1V (+Δ)', exp: 'Normal Operation (경계 안쪽)', is2Val: false },

    { val: '16.0', x: 578, label: '16.0V (On)', exp: 'Normal Operation (상한 경계 정상)', is2Val: true },

    const v = parseFloat(document.getElementById('bva-slider').value);
    const vStr = v.toFixed(1);

        </g>

    }).join('');

    const isValid = v >= 9.0 && v <= 16.0;
    const matchedPt = activeTargets.find(p => p.val === vStr);
    const verdict = document.getElementById('bva-live-verdict');
    verdict.className = `p-3.5 rounded-xl border text-xs sm:text-sm ${isValid ? 'bg-emerald-50 border-emerald-300 text-emerald-950' : 'bg-rose-50 border-rose-300 text-rose-950'}`;
    verdict.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span><strong>입력 ${vStr}V 판정:</strong> ${matchedPt ? matchedPt.exp : (isValid ? 'Normal Operation (일반 정상 구간)' : 'Out-of-Range Fault (경계 밖 무효 구간)')}</span>
        <span class="px-2 py-0.5 rounded text-[11px] font-bold ${matchedPt ? 'bg-hyundai-navy text-white' : 'bg-slate-200 text-slate-700'}">${matchedPt ? '★ 핵심 BVA 테스트 포인트' : '일반 구간 값'}</span>
      </div>
    `;
  };
  window.setBvaMode('3val');
}

          <button onclick="triggerStateEvent('IGN_OFF')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold">6. IGN OFF</button>
        </div>
      </div>
      <div id="st-transition-log" class="p-3.5 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm"></div>
    </div>
  `;

  function updateVisualStateMachine(msg, isValid, lastEdgeId = null) {
    ['OFF', 'READY', 'ACTIVE', 'FAULT'].forEach(st => {
      const rect = document.querySelector(`#svg-st-${st} rect`);
      if (st === curState) {
        rect.setAttribute('fill', st === 'FAULT' ? '#E11D48' : (st === 'ACTIVE' ? '#059669' : '#0284C7'));
        rect.setAttribute('stroke', '#FDE047'); rect.setAttribute('stroke-width', '3.5');
      } else {
        rect.setAttribute('fill', '#1E293B'); rect.setAttribute('stroke', '#64748B'); rect.setAttribute('stroke-width', '2');
      }
    });
    ['edge-OFF-READY', 'edge-READY-ACTIVE', 'edge-ACTIVE-READY', 'edge-ACTIVE-FAULT', 'edge-READY-FAULT', 'edge-FAULT-READY'].forEach(eid => {
      const p = document.getElementById(eid);
      if (!p) return;
      p.classList.remove('svg-flow-active');
      if (eid === lastEdgeId) { p.setAttribute('stroke', '#FDE047'); p.setAttribute('stroke-width', '3.5'); p.classList.add('svg-flow-active'); }
      else if (visitedTransitions.has(eid)) { p.setAttribute('stroke', '#34D399'); p.setAttribute('stroke-width', '2.5'); }
      else { p.setAttribute('stroke', '#475569'); p.setAttribute('stroke-width', '2'); }
    });
    const bulb = document.getElementById('svg-lamp-bulb');
    const lbl = document.getElementById('svg-lamp-label');
    if (curState === 'ACTIVE') { bulb.setAttribute('fill', '#FACC15'); lbl.setAttribute('fill', '#FDE047'); lbl.textContent = 'LAMP ON (80%)'; }
    else if (curState === 'FAULT') { bulb.setAttribute('fill', '#E11D48'); lbl.setAttribute('fill', '#FDA4AF'); lbl.textContent = 'FAIL-SAFE'; }
    else { bulb.setAttribute('fill', '#334155'); lbl.setAttribute('fill', '#94A3B8'); lbl.textContent = 'LAMP OFF'; }

    document.getElementById('st-cov-badge').textContent = `유효 전이 탐지: ${visitedTransitions.size}/6`;
    document.getElementById('st-transition-log').innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
        <span>현재 상태: <strong class="text-hyundai-navy">${curState}</strong></span>
        <span class="px-2 py-0.5 rounded text-xs font-bold ${isValid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${isValid ? '✔ 유효 전이 (Valid Transition)' : '⚠ 무효 전이 (Invalid Transition - 상태 불변 검증)'}</span>
      </div>
      <p class="text-slate-700">${msg}</p>
    `;
  }

  window.resetStateSim = () => { curState = 'OFF'; visitedTransitions = new Set(); updateVisualStateMachine('초기 상태 OFF입니다. 이벤트를 클릭해 유효 전이와 무효 전이를 모두 검증해 보세요.', true); };

  window.triggerStateEvent = (ev) => {
    const prev = curState; let valid = false; let edge = null; let msg = '';
    if (ev === 'IGN_ON') {
      if (curState === 'OFF') { curState = 'READY'; valid = true; edge = 'edge-OFF-READY'; msg = 'OFF → READY: 시동 ON으로 대기 상태 진입'; }
      else msg = `${prev} 상태에서 IGN ON 입력 → 허용되지 않은 전이이므로 ${prev} 유지`;
    } else if (ev === 'LAMP_ON') {
      if (curState === 'READY') { curState = 'ACTIVE'; valid = true; edge = 'edge-READY-ACTIVE'; msg = 'READY → ACTIVE: 하향등 점등 상태 진입'; }
      else if (curState === 'FAULT') msg = 'FAULT 상태에서 LampCmd ON 입력 → 안전 잠금 상태이므로 명령 무시 및 FAULT 유지!';
      else msg = `${prev} 상태에서 LampCmd ON 입력 → 무효 전이 (${prev} 유지)`;
    } else if (ev === 'LAMP_OFF') {
      if (curState === 'ACTIVE') { curState = 'READY'; valid = true; edge = 'edge-ACTIVE-READY'; msg = 'ACTIVE → READY: 하향등 소등 및 대기 상태 복귀'; }
      else msg = `${prev} 상태에서 LampCmd OFF 입력 → ${prev} 상태 유지`;
    } else if (ev === 'FAULT') {
      if (curState === 'READY' || curState === 'ACTIVE') { edge = curState === 'ACTIVE' ? 'edge-ACTIVE-FAULT' : 'edge-READY-FAULT'; curState = 'FAULT'; valid = true; msg = `${prev} → FAULT: 고장 감지로 즉시 출력 차단 및 안전 상태 진입`; }
      else msg = `${prev} 상태에서 Fault 이벤트 → ${prev} 유지`;
    } else if (ev === 'FAULT_CLEAR') {
      if (curState === 'FAULT') { curState = 'READY'; valid = true; edge = 'edge-FAULT-READY'; msg = 'FAULT → READY: 고장 해제 후 대기 상태 복귀'; }
      else msg = `${prev} 상태에서 FaultClear 입력 → 고장 상태가 아니므로 무시됨`;
    } else if (ev === 'IGN_OFF') {
      if (curState !== 'OFF') { curState = 'OFF'; valid = true; msg = `${prev} → OFF: IGN OFF 입력으로 모든 상태에서 즉시 OFF 복귀`; }
      else msg = '이미 OFF 상태입니다.';
    }
    if (edge) visitedTransitions.add(edge);
    updateVisualStateMachine(msg, valid, edge);
  };
  window.resetStateSim();
}

        if (evalD(r1) === evalD(r2)) continue;
        if (r1.a !== r2.a && r1.b === r2.b && r1.c === r2.c) pairA = `${r1.id} ↔ ${r2.id}`;
        if (r1.b !== r2.b && r1.a === r2.a && r1.c === r2.c) pairB = `${r1.id} ↔ ${r2.id}`;
        if (r1.c !== r2.c && r1.a === r2.a && r1.b === r2.b) pairC = `${r1.id} ↔ ${r2.id}`;
      }
    }

    const coveredCount = [pairA, pairB, pairC].filter(Boolean).length;
    const mcdcPct = Math.round((coveredCount / 3) * 100);
    const box = document.getElementById('mcdc-analysis-box');
    box.className = `p-4 rounded-xl border text-xs sm:text-sm space-y-2 ${mcdcPct === 100 ? 'bg-emerald-50 border-emerald-300 text-emerald-950' : 'bg-rose-50 border-rose-300 text-rose-950'}`;
    box.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="font-bold">MC/DC 독립성 증명 결과: <strong class="text-base">${mcdcPct}% (${coveredCount}/3 조건)</strong></span>
        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${mcdcPct === 100 ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">${mcdcPct === 100 ? 'MC/DC 100% 충족' : '독립성 쌍 결함 발생'}</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1">
        <div class="p-2 rounded bg-white border border-slate-200"><strong>조건 A 독립성:</strong> ${pairA ? `<span class="text-emerald-700 font-bold">${pairA}</span>` : '<span class="text-rose-600 font-bold">미증명</span>'}</div>
        <div class="p-2 rounded bg-white border border-slate-200"><strong>조건 B 독립성:</strong> ${pairB ? `<span class="text-emerald-700 font-bold">${pairB}</span>` : '<span class="text-rose-600 font-bold">미증명</span>'}</div>

      </div>
    `;
  }
  renderMcdcUI();
}

function extractBalanced15Questions() {
  const categories = [...new Set(QUESTION_BANK.map(q => q.category))];
  const picked = [];
  const shuffledCats = [...categories].sort(() => Math.random() - 0.5);
  shuffledCats.forEach((cat, idx) => {
    const pool = QUESTION_BANK.filter(q => q.category === cat).sort(() => Math.random() - 0.5);
    const takeCount = idx < 6 ? 2 : 1;
    for (let i = 0; i < takeCount && i < pool.length; i++) picked.push(pool[i]);
  });
  return picked.sort(() => Math.random() - 0.5);
}

                  const isChecked = selected.includes(optIdx);

                    <button onclick="selectQuizOption('${q.id}', ${optIdx}, ${isMulti})" id="opt-${q.id}-${optIdx}" class="w-full text-left px-4 py-3 rounded-xl border text-xs sm:text-sm transition flex items-start gap-3 ${isChecked ? 'bg-blue-50 border-hyundai-navy text-hyundai-navy font-bold' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}">
                      <span class="w-5 h-5 rounded-${isMulti ? 'md' : 'full'} border flex items-center justify-center shrink-0 mt-0.5 text-xs ${isChecked ? 'bg-hyundai-navy text-white border-hyundai-navy' : 'border-slate-400 text-slate-500'}">${isChecked ? '✓' : optIdx + 1}</span>
                      <span>${opt}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="flex justify-end">
        <button onclick="submitQuiz()" class="px-6 py-3 bg-hyundai-navy hover:bg-blue-900 text-white rounded-xl text-sm font-bold shadow-md transition">전체 답안 최종 제출하기</button>
      </div>
    </div>
  `;
}

function selectQuizOption(qId, optIdx, isMulti) {
  if (!activeQuiz || activeQuiz.submitted) return;
  let current = activeQuiz.userAnswers[qId] || [];
  if (isMulti) {
    if (current.includes(optIdx)) current = current.filter(i => i !== optIdx);
    else current = [...current, optIdx].sort((a, b) => a - b);
  } else current = [optIdx];
  activeQuiz.userAnswers[qId] = current;

  const qObj = activeQuiz.questions.find(q => q.id === qId);
  qObj.options.forEach((_, idx) => {
    const btn = document.getElementById(`opt-${qId}-${idx}`);
    const isChecked = current.includes(idx);
    btn.className = `w-full text-left px-4 py-3 rounded-xl border text-xs sm:text-sm transition flex items-start gap-3 ${isChecked ? 'bg-blue-50 border-hyundai-navy text-hyundai-navy font-bold' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`;
    const badge = btn.querySelector('span');
    badge.className = `w-5 h-5 rounded-${isMulti ? 'md' : 'full'} border flex items-center justify-center shrink-0 mt-0.5 text-xs ${isChecked ? 'bg-hyundai-navy text-white border-hyundai-navy' : 'border-slate-400 text-slate-500'}`;
    badge.textContent = isChecked ? '✓' : idx + 1;
  });

  const answeredCount = Object.keys(activeQuiz.userAnswers).filter(id => activeQuiz.userAnswers[id].length > 0).length;
  const badgeEl = document.getElementById('quiz-answered-badge');
  if (badgeEl) badgeEl.textContent = `${answeredCount} / ${activeQuiz.questions.length}`;
}

function submitQuiz() {
  if (!activeQuiz) return;
  const unanswered = activeQuiz.questions.filter(q => !activeQuiz.userAnswers[q.id] || activeQuiz.userAnswers[q.id].length === 0);
  if (unanswered.length > 0) {
    showModal('미응답 문항 안내', `<p>아직 답안을 선택하지 않은 문항이 <strong>${unanswered.length}개</strong> 있습니다. 미응답 문항은 오답으로 처리됩니다. 그대로 제출하시겠습니까?</p>`, [
      { label: '계속 풀기', primary: false, onClick: closeModal },
      { label: '제출 및 채점', primary: true, onClick: () => { closeModal(); finalizeQuizGrading(); } }
    ]);
  } else finalizeQuizGrading();
}

function finalizeQuizGrading() {
  activeQuiz.submitted = true;
  let correctCount = 0;
  const categoryBreakdown = {};
  const wrongIdsInSession = [];

  activeQuiz.questions.forEach(q => {
    const userAns = (activeQuiz.userAnswers[q.id] || []).slice().sort((a, b) => a - b);
    const trueAns = q.answer.slice().sort((a, b) => a - b);
    const isCorrect = userAns.length === trueAns.length && userAns.every((val, i) => val === trueAns[i]);

    if (!categoryBreakdown[q.category]) categoryBreakdown[q.category] = { total: 0, correct: 0 };
    categoryBreakdown[q.category].total += 1;

    if (!appState.questionStats[q.id]) appState.questionStats[q.id] = { attempts: 0, wrongCount: 0, category: q.category, concept: q.concept };
    appState.questionStats[q.id].attempts += 1;

    if (isCorrect) {
      correctCount += 1;
      categoryBreakdown[q.category].correct += 1;
    } else {
      appState.questionStats[q.id].wrongCount += 1;
      wrongIdsInSession.push(q.id);
      if (!appState.wrongNotes.includes(q.id)) appState.wrongNotes.push(q.id);
    }
  });

  const total = activeQuiz.questions.length;
  const wrongCount = total - correctCount;
  const rate = Math.round((correctCount / total) * 100);

  appState.quizHistory.push({ date: new Date().toLocaleString('ko-KR'), title: activeQuiz.title, score: rate, correctCount, total, rate });
  saveState();
  renderSidebar();

  const main = document.getElementById('main-content');
  main.scrollTop = 0;

  main.innerHTML = `
    <div class="max-w-4xl mx-auto space-y-6 pb-12">
      <div class="bg-white p-6 sm:p-8 rounded-2xl border border-hyundai-border shadow-md">
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-5">
          <div>
            <span class="text-xs font-bold text-hyundai-blue">Quiz Result Report</span>
            <h2 class="text-2xl font-extrabold text-hyundai-navy mt-0.5">${activeQuiz.title} 결과</h2>
          </div>
          <div class="flex flex-wrap gap-2">
            ${wrongIdsInSession.length > 0 ? `<button onclick="retryWrongFromSession()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow transition">틀린 문제만 다시 풀기 (${wrongIdsInSession.length}문항)</button>` : ''}
            <button onclick="navigateTo('quiz_random')" class="px-4 py-2 bg-hyundai-navy hover:bg-blue-900 text-white rounded-xl text-xs font-bold transition">새 랜덤 퀴즈 재시험</button>
            <button onclick="navigateTo('dashboard')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">대시보드로</button>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4 pt-5 text-center">
          <div class="p-4 rounded-xl bg-blue-50 border border-blue-200">
            <div class="text-xs font-semibold text-slate-500">총점 / 정답률</div>
            <div class="text-3xl font-extrabold text-hyundai-navy mt-1">${rate}<span class="text-base font-bold">%</span></div>
          </div>
          <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
            <div class="text-xs font-semibold text-slate-500">정답 수</div>
            <div class="text-3xl font-extrabold text-emerald-600 mt-1">${correctCount}<span class="text-base font-bold">문항</span></div>
          </div>
          <div class="p-4 rounded-xl bg-rose-50 border border-rose-200">
            <div class="text-xs font-semibold text-slate-500">오답 수 (오답노트 저장)</div>
            <div class="text-3xl font-extrabold text-rose-600 mt-1">${wrongCount}<span class="text-base font-bold">문항</span></div>
          </div>
        </div>

        <div class="mt-6 pt-5 border-t border-slate-100">
          <h3 class="text-sm font-bold text-hyundai-navy mb-3">단원별 정답률 분석</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${Object.entries(categoryBreakdown).map(([cat, st]) => {
              const cRate = Math.round((st.correct / st.total) * 100);
              return `<div class="p-3 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between text-xs"><span class="font-semibold text-slate-700 truncate pr-2">${cat}</span><span class="font-bold shrink-0 ${cRate >= 80 ? 'text-emerald-600' : (cRate >= 50 ? 'text-amber-600' : 'text-rose-600')}">${st.correct}/${st.total} (${cRate}%)</span></div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <h3 class="text-base font-bold text-hyundai-navy">문항별 상세 채점 및 해설</h3>
        ${activeQuiz.questions.map((q, idx) => {
          const userAns = (activeQuiz.userAnswers[q.id] || []).slice().sort((a, b) => a - b);
          const trueAns = q.answer.slice().sort((a, b) => a - b);
          const isCorrect = userAns.length === trueAns.length && userAns.every((val, i) => val === trueAns[i]);
          return `
            <div class="bg-white p-5 rounded-xl border-2 ${isCorrect ? 'border-emerald-200' : 'border-rose-300'} shadow-sm space-y-3">
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${isCorrect ? '✓ 정답' : '✕ 오답'} · 문항 ${idx + 1} (${q.id} | ${q.category})</span>
                <span class="text-slate-500 font-mono">${q.source}</span>
              </div>
              <p class="text-sm font-bold text-slate-800">${q.question}</p>
              <div class="space-y-1.5 text-xs">
                ${q.options.map((opt, oIdx) => {
                  const isUser = userAns.includes(oIdx);
                  const isTrue = trueAns.includes(oIdx);
                  let cls = 'bg-slate-50 border-slate-200 text-slate-600';
                  if (isTrue) cls = 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold';
                  else if (isUser && !isTrue) cls = 'bg-rose-50 border-rose-400 text-rose-950 font-bold';
                  return `<div class="px-3 py-2 rounded-lg border ${cls} flex justify-between"><span>${oIdx + 1}) ${opt}</span><span>${isTrue ? '[정답]' : (isUser ? '[내 선택]' : '')}</span></div>`;
                }).join('')}
              </div>
              <div class="p-3.5 rounded-lg bg-slate-50 border border-slate-200 text-xs space-y-1 leading-relaxed">
                <div class="text-emerald-800"><strong>[정답 해설]</strong> ${q.explanation}</div>
                <div class="text-slate-600"><strong>[오답 분석]</strong> ${q.wrongExplanation}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  window.retryWrongFromSession = () => {
    const wrongQs = activeQuiz.questions.filter(q => wrongIdsInSession.includes(q.id));
    startQuizSession(main, 'wrong_retry', wrongQs);
  };
}

                    <tr><td class="px-3 py-2 text-slate-500">${h.date}</td><td class="px-3 py-2 font-semibold text-slate-800">${h.title}</td><td class="px-3 py-2 text-center font-mono">${h.correctCount} / ${h.total}</td><td class="px-3 py-2 text-center font-bold text-hyundai-navy">${h.rate}%</td></tr>
                  `).join('')}
                </tbody>
              </table>
            </div>`
        }
      </div>
    </div>
  `;
}

// ============================================================================
// 9. INITIALIZATION
// ============================================================================
function initApp() {
  updateGlobalProgressUI();
  renderSidebar();
  navigateTo('dashboard');
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
</body>
</html>
